<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap"
    />
    <meta name="description" content="Rivet - AI prompt chain and AI agent IDE" />
    <title>Rivet</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Independent of the module graph: an entry/dependency fetch can fail
      // before entry.tsx has had any opportunity to install its own handler.
      window.__rivetShowBootstrapFailure = function () {
        if (window.__rivetEditorBootstrapState === 'ready') return;
        window.__rivetEditorBootstrapState = 'failed';
        const root = document.getElementById('root');
        if (root) {
          root.replaceChildren();
          const panel = document.createElement('section');
          panel.setAttribute('role', 'alert');
          panel.style.cssText =
            'max-width:560px;margin:12vh auto;padding:24px;background:#25262b;color:#eee;border-radius:8px;font:16px/1.5 sans-serif';
          const heading = document.createElement('h2');
          heading.textContent = 'Rivet could not finish loading';
          const explanation = document.createElement('p');
          explanation.textContent =
            'An application file could not be loaded. Check your connection or tunnel sign-in, wait for any development build to finish, then retry. Your saved projects and browser recovery data have not been reset.';
          const retry = document.createElement('button');
          retry.textContent = 'Retry loading';
          retry.style.cssText = 'padding:10px 16px;font:inherit;cursor:pointer';
          retry.onclick = function () {
            window.location.reload();
          };
          panel.append(heading, explanation, retry);
          root.append(panel);
        }
        if (window.parent !== window)
          window.parent.postMessage({ type: 'editor-initialization-failed' }, window.location.origin);
      };
      window.addEventListener(
        'error',
        function (event) {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module')
            window.__rivetShowBootstrapFailure();
        },
        true,
      );
    </script>
    <script type="module" src="/entry.tsx"></script>
  </body>
</html>
