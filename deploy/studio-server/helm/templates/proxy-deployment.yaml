{{- if and (eq .Values.gateway.mode "embedded") (ne .Values.deploymentProfile "single-machine") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rivet.proxyServiceName" . }}
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.replicaCount.proxy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "rivet.componentLabels" (dict "root" . "component" "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rivet.componentLabels" (dict "root" . "component" "proxy") | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations.proxy }}
{{ toYaml . | nindent 8 }}
        {{- end }}
        {{- include "rivet.vaultProxyAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- include "rivet.pod.placement" (dict "root" . "component" "proxy") | nindent 6 }}
      securityContext:
        fsGroup: 10001
      containers:
{{ include "rivet.containers.proxy" . | nindent 8 }}
      {{- if .Values.tmpVolume.enabled }}
      volumes:
{{ include "rivet.pod.tmpVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
