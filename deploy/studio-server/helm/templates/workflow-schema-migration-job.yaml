{{- if .Values.workflowSchema.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rivet.fullname" . }}-workflow-schema-migration
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-schema-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.workflowSchema.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.workflowSchema.migrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "rivet.componentLabels" (dict "root" . "component" "workflow-schema-migration") | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations.workflowSchemaMigration }}
{{ toYaml . | nindent 8 }}
        {{- end }}
        {{- include "rivet.vaultAnnotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "rivet.pod.imagePullSecrets" . | nindent 6 }}
      {{- include "rivet.pod.workloadSecurityContext" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "rivet.image" (dict "root" . "image" .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          {{- include "rivet.pod.containerSecurityContext" . | nindent 10 }}
          command:
            - /bin/sh
            - -ec
          args:
            - . /opt/rivet/lib/load-env.sh; load_optional_dotenv /vault/dotenv; node /opt/rivet/lib/bootstrap-deployment-storage-settings.mjs; RIVET_APP_SETTINGS_BACKEND=file RIVET_MANAGED_WORKFLOW_SCHEMA_MIN_VERSION={{ .Values.workflowSchema.compatibility.maximumVersion | quote }} RIVET_MANAGED_WORKFLOW_SCHEMA_MAX_VERSION={{ .Values.workflowSchema.compatibility.maximumVersion | quote }} node /app/packages/studio-server-api/dist/studio-server-api/src/scripts/migrate-managed-workflow-schema.js migrate; node /app/packages/studio-server-api/dist/studio-server-api/src/scripts/import-managed-app-settings.js
          env:
{{ include "rivet.env.deploymentStorageBootstrap" (dict "root" . "appDataRoot" "/var/tmp/rivet-migration-app-data") | nindent 12 }}
{{ include "rivet.env.appSettings" (dict "root" . "includeDatabase" false) | nindent 12 }}
{{ include "rivet.env.authKey" . | nindent 12 }}
            {{- if .Values.appSettings.legacyImport.existingClaimName }}
            - name: RIVET_APP_SETTINGS_LEGACY_ROOT
              value: /legacy-rivet-app
            {{- end }}
            - name: RIVET_BUILD_VERSION
              value: {{ include "rivet.image" (dict "root" . "image" .Values.images.api) | quote }}
          volumeMounts:
            {{- if .Values.appSettings.legacyImport.existingClaimName }}
            - name: legacy-app-data
              mountPath: /legacy-rivet-app
              readOnly: true
            {{- end }}
{{ include "rivet.pod.tmpVolumeMount" . | nindent 12 }}
          resources:
{{ toYaml .Values.resources.api | nindent 12 }}
      volumes:
        {{- if .Values.appSettings.legacyImport.existingClaimName }}
        - name: legacy-app-data
          persistentVolumeClaim:
            claimName: {{ .Values.appSettings.legacyImport.existingClaimName | quote }}
        {{- end }}
{{ include "rivet.pod.tmpVolume" . | nindent 8 }}
{{- end }}
