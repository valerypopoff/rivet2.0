{{- if and (eq .Values.gateway.mode "embedded") .Values.autoscaling.proxy.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rivet.proxyServiceName" . }}
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rivet.proxyServiceName" . }}
  minReplicas: {{ .Values.autoscaling.proxy.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.proxy.maxReplicas }}
  {{- if or .Values.autoscaling.executionController.enabled .Values.autoscaling.proxy.scaleDownPaused }}
  behavior:
    scaleDown:
      {{- if .Values.autoscaling.proxy.scaleDownPaused }}
      selectPolicy: Disabled
      {{- end }}
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
  {{- end }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.proxy.targetCPUUtilizationPercentage }}
{{- end }}
