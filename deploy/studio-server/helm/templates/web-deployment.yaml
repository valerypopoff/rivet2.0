{{- if ne .Values.deploymentProfile "single-machine" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rivet.webServiceName" . }}
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
      maxSurge: {{ .Values.rollout.maxSurge }}
  selector:
    matchLabels:
      {{- include "rivet.componentLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rivet.componentLabels" (dict "root" . "component" "web") | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations.web }}
{{ toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.ha.enabled }}
        {{- include "rivet.vaultWebAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- include "rivet.pod.placement" (dict "root" . "component" "web") | nindent 6 }}
      securityContext:
        fsGroup: 10001
      containers:
{{ include "rivet.containers.web" . | nindent 8 }}
      {{- if .Values.tmpVolume.enabled }}
      volumes:
{{ include "rivet.pod.tmpVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
