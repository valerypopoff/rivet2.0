{{- range $component := list "proxy" "web" "execution" -}}
{{- $replicas := int (index $.Values.replicaCount $component) -}}
{{- $autoscaling := index $.Values.autoscaling $component -}}
{{- $minimumReplicas := ternary (int $autoscaling.minReplicas) $replicas $autoscaling.enabled -}}
{{- if and (gt $minimumReplicas 1) (ge (int $.Values.availability.disruptionBudget.maxUnavailable) $minimumReplicas) -}}
{{- fail (printf "availability.disruptionBudget.maxUnavailable must be less than the effective minimum replica count for %s" $component) -}}
