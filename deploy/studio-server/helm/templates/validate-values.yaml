{{- end -}}
{{- if empty .Values.release.production.verification.workflow -}}
{{- fail "release.production.verification.workflow is required for a production release manifest" -}}
{{- end -}}
{{- if empty .Values.release.production.verification.runId -}}
{{- fail "release.production.verification.runId is required for a production release manifest" -}}
{{- end -}}
{{- if lt (int .Values.release.production.verification.runAttempt) 1 -}}
{{- fail "release.production.verification.runAttempt must be greater than zero for a production release manifest" -}}
{{- end -}}
{{- if ne .Values.release.production.chart.name .Chart.Name -}}
{{- fail "release.production.chart.name must equal the deployed chart name from a promoted release manifest" -}}
{{- end -}}
{{- if ne .Values.release.production.chart.version .Chart.Version -}}
{{- fail "release.production.chart.version must equal the deployed chart version from a promoted release manifest" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.release.production.chart.contentDigest) -}}
{{- fail "release.production.chart.contentDigest must be a sha256 digest from a promoted release manifest" -}}
