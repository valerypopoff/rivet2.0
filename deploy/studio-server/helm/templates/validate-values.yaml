{{- if .Values.availability.disruptionBudget.enabled -}}
{{- if lt (int .Values.availability.disruptionBudget.maxUnavailable) 1 -}}
{{- fail "availability.disruptionBudget.maxUnavailable must be greater than zero" -}}
