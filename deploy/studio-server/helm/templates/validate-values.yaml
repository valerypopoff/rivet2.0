{{- $kubernetesQuantityPattern := "^[+]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$" -}}
{{- $zeroKubernetesQuantityPattern := "^[+]?0+([.]0+)?([eE][+-]?[0-9]+)?([numkMGTPE]|[KMGTPE]i)?$" -}}

{{- if ne .Values.workflowStorage.backend .Values.runtimeLibraries.backend -}}
{{- fail "workflowStorage.backend and runtimeLibraries.backend must stay unified in phase 3" -}}
{{- end -}}

{{- if or (ne .Values.workflowStorage.backend "managed") (ne .Values.runtimeLibraries.backend "managed") -}}
{{- fail "The phase 4 chart shape requires workflowStorage.backend=managed and runtimeLibraries.backend=managed" -}}
{{- end -}}

{{- if hasKey .Values.vault "roleIdSecretName" -}}
{{- fail "vault.roleIdSecretName is retired; use vault.role with the Vault Injector dotenv contract" -}}
{{- end -}}

{{- $vaultInjectionEnabled := and .Values.vault.enabled (not (empty .Values.vault.secretPath)) -}}
{{- if $vaultInjectionEnabled -}}
{{- $vaultAgentResources := .Values.vault.agentResources -}}
{{- if not (kindIs "map" $vaultAgentResources) -}}
{{- fail "vault.agentResources must be a map when Vault dotenv injection is enabled" -}}
{{- end -}}
{{- range $tier := list "requests" "limits" -}}
{{- $tierResources := default (dict) (index $vaultAgentResources $tier) -}}
{{- if not (kindIs "map" $tierResources) -}}
{{- fail (printf "vault.agentResources.%s must be a map when Vault dotenv injection is enabled" $tier) -}}
{{- end -}}
{{- range $resourceName := list "cpu" "memory" "ephemeral-storage" -}}
{{- $quantity := default "" (index $tierResources $resourceName) -}}
{{- if or (not (kindIs "string" $quantity)) (empty $quantity) (not (regexMatch $kubernetesQuantityPattern $quantity)) (regexMatch $zeroKubernetesQuantityPattern $quantity) -}}
{{- fail (printf "vault.agentResources.%s.%s must be a positive Kubernetes quantity string when Vault dotenv injection is enabled" $tier $resourceName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- if ne .Values.runtimeLibraries.objectStoragePrefix "runtime-libraries/" -}}
{{- fail "runtimeLibraries.objectStoragePrefix must remain runtime-libraries/ in phase 3 because the current managed runtime-library backend uses a fixed object-storage prefix" -}}
{{- end -}}

{{- if hasKey .Values.env "RIVET_MANAGED_WORKFLOW_SCHEMA_MODE" -}}
{{- fail "env.RIVET_MANAGED_WORKFLOW_SCHEMA_MODE is chart-owned; use workflowSchema.migrationJob.enabled and keep API workloads verify-only" -}}
{{- end -}}

{{- if hasKey .Values.env "RIVET_DEPLOYMENT_MANAGED_WORKFLOW_SCHEMA_MODE" -}}
{{- fail "env.RIVET_DEPLOYMENT_MANAGED_WORKFLOW_SCHEMA_MODE is an internal chart-owned startup policy and cannot be overridden" -}}
{{- end -}}

{{- range $key := list "RIVET_MANAGED_WORKFLOW_SCHEMA_MIN_VERSION" "RIVET_MANAGED_WORKFLOW_SCHEMA_MAX_VERSION" "RIVET_DEPLOYMENT_MANAGED_WORKFLOW_SCHEMA_MIN_VERSION" "RIVET_DEPLOYMENT_MANAGED_WORKFLOW_SCHEMA_MAX_VERSION" -}}
{{- if hasKey $.Values.env $key -}}
{{- fail (printf "env.%s is chart-owned; configure workflowSchema.compatibility through the immutable release manifest" $key) -}}
{{- end -}}
{{- end -}}

{{- if hasKey .Values.env "RIVET_DEPLOYMENT_DATABASE_POOL_MAX" -}}
{{- fail "env.RIVET_DEPLOYMENT_DATABASE_POOL_MAX is chart-owned; configure postgres.poolMaxPerApiPod instead" -}}
{{- end -}}

{{- range $key := list "RIVET_PUBLISHED_EXECUTION_ADMISSION_MODE" "RIVET_PUBLISHED_EXECUTION_MAX_ACTIVE_RUNS" "RIVET_PUBLISHED_EXECUTION_RETRY_AFTER_SECONDS" "RIVET_DEPLOYMENT_PUBLISHED_EXECUTION_ADMISSION_MODE" "RIVET_DEPLOYMENT_PUBLISHED_EXECUTION_MAX_ACTIVE_RUNS" "RIVET_DEPLOYMENT_PUBLISHED_EXECUTION_RETRY_AFTER_SECONDS" -}}
{{- if hasKey $.Values.env $key -}}
{{- fail (printf "env.%s is chart-owned; configure publishedExecutionAdmission instead" $key) -}}
{{- end -}}
{{- end -}}

{{- $publishedExecutionAdmissionMode := .Values.publishedExecutionAdmission.mode -}}
{{- if not (has $publishedExecutionAdmissionMode (list "disabled" "observe" "enforce")) -}}
{{- fail "publishedExecutionAdmission.mode must be disabled, observe, or enforce" -}}
{{- end -}}
{{- $publishedExecutionMaxActiveRuns := int .Values.publishedExecutionAdmission.maxActiveRunsPerPod -}}
{{- if or (lt $publishedExecutionMaxActiveRuns 1) (gt $publishedExecutionMaxActiveRuns 10000) -}}
{{- fail "publishedExecutionAdmission.maxActiveRunsPerPod must be an integer between 1 and 10000" -}}
{{- end -}}
{{- $publishedExecutionRetryAfterSeconds := int .Values.publishedExecutionAdmission.retryAfterSeconds -}}
{{- if or (lt $publishedExecutionRetryAfterSeconds 1) (gt $publishedExecutionRetryAfterSeconds 3600) -}}
{{- fail "publishedExecutionAdmission.retryAfterSeconds must be an integer between 1 and 3600" -}}
{{- end -}}

{{- $writableVolumeLimits := .Values.writableVolumeLimits -}}
{{- if not (kindIs "map" $writableVolumeLimits) -}}
{{- fail "writableVolumeLimits must be a map" -}}
{{- end -}}
{{- range $volume := list "workspace" "workflows" "appData" "runtimeLibraries" -}}
{{- $sizeLimit := default "" (index $writableVolumeLimits $volume) -}}
{{- if or (not (kindIs "string" $sizeLimit)) (not (regexMatch "^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei)$" $sizeLimit)) -}}
{{- fail (printf "writableVolumeLimits.%s must be a positive binary Kubernetes quantity such as 2Gi" $volume) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.tmpVolume.enabled (or (not (kindIs "string" .Values.tmpVolume.sizeLimit)) (not (regexMatch "^[1-9][0-9]*(Ki|Mi|Gi|Ti|Pi|Ei)$" .Values.tmpVolume.sizeLimit))) -}}
{{- fail "tmpVolume.sizeLimit must be a positive binary Kubernetes quantity such as 2Gi when tmpVolume.enabled=true" -}}
{{- end -}}

{{- $resourceLimitAcknowledgements := .Values.resourceLimitAcknowledgements -}}
{{- $productionReleaseEnabled := .Values.release.production.enabled -}}
{{- if not (kindIs "map" $resourceLimitAcknowledgements) -}}
{{- fail "resourceLimitAcknowledgements must be a map" -}}
{{- end -}}
{{- range $component := list "proxy" "web" "api" "executor" "execution" -}}
{{- $resources := index $.Values.resources $component -}}
{{- if not (kindIs "map" $resources) -}}
{{- fail (printf "resources.%s must be a map" $component) -}}
{{- end -}}
{{- $requests := default (dict) (index $resources "requests") -}}
{{- $limits := default (dict) (index $resources "limits") -}}
{{- $acknowledgements := default (dict) (index $resourceLimitAcknowledgements $component) -}}
{{- if or (not (kindIs "map" $requests)) (not (kindIs "map" $limits)) (not (kindIs "map" $acknowledgements)) -}}
{{- fail (printf "resources.%s requests/limits and resourceLimitAcknowledgements.%s must be maps" $component $component) -}}
{{- end -}}
{{- $memoryRequest := default "" (index $requests "memory") -}}
{{- $memoryLimit := default "" (index $limits "memory") -}}
{{- $ephemeralStorageRequest := default "" (index $requests "ephemeral-storage") -}}
{{- $ephemeralStorageLimit := default "" (index $limits "ephemeral-storage") -}}
{{- $memoryAcknowledgement := default "" (index $acknowledgements "memory") -}}
{{- $ephemeralStorageAcknowledgement := default "" (index $acknowledgements "ephemeralStorage") -}}
{{- if or (not (kindIs "string" $memoryAcknowledgement)) (not (kindIs "string" $ephemeralStorageAcknowledgement)) -}}
{{- fail (printf "resourceLimitAcknowledgements.%s.memory and .ephemeralStorage must be strings" $component) -}}
{{- end -}}
{{- $resourceQuantities := dict
  (printf "resources.%s.requests.memory" $component) $memoryRequest
  (printf "resources.%s.limits.memory" $component) $memoryLimit
  (printf "resources.%s.requests.ephemeral-storage" $component) $ephemeralStorageRequest
  (printf "resources.%s.limits.ephemeral-storage" $component) $ephemeralStorageLimit
-}}
{{- range $quantityPath, $quantity := $resourceQuantities -}}
{{- if and (not (empty $quantity)) (or (not (kindIs "string" $quantity)) (not (regexMatch $kubernetesQuantityPattern $quantity)) (regexMatch $zeroKubernetesQuantityPattern $quantity)) -}}
{{- fail (printf "%s must be a positive Kubernetes quantity string when set" $quantityPath) -}}
{{- end -}}
{{- end -}}
{{- $hasMemoryLimit := and (not (empty $memoryRequest)) (not (empty $memoryLimit)) -}}
{{- $hasEphemeralStorageLimit := and (not (empty $ephemeralStorageRequest)) (not (empty $ephemeralStorageLimit)) -}}
{{- if and $hasMemoryLimit (not (empty $memoryAcknowledgement)) -}}
{{- fail (printf "resourceLimitAcknowledgements.%s.memory must be empty when resources.%s has memory request and limit" $component $component) -}}
{{- end -}}
{{- if and $hasEphemeralStorageLimit (not (empty $ephemeralStorageAcknowledgement)) -}}
{{- fail (printf "resourceLimitAcknowledgements.%s.ephemeralStorage must be empty when resources.%s has ephemeral-storage request and limit" $component $component) -}}
{{- end -}}
{{- if $productionReleaseEnabled -}}
{{- if and (not $hasMemoryLimit) (lt (len (trim $memoryAcknowledgement)) 24) -}}
{{- fail (printf "production requires resources.%s memory request and limit or a 24-character resourceLimitAcknowledgements.%s.memory rationale" $component $component) -}}
{{- end -}}
{{- if and (not $hasEphemeralStorageLimit) (lt (len (trim $ephemeralStorageAcknowledgement)) 24) -}}
{{- fail (printf "production requires resources.%s ephemeral-storage request and limit or a 24-character resourceLimitAcknowledgements.%s.ephemeralStorage rationale" $component $component) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- range $key := list "RIVET_METRICS_ENABLED" "RIVET_DEPLOYMENT_METRICS_ENABLED" -}}
{{- if hasKey $.Values.env $key -}}
{{- fail (printf "env.%s is chart-owned; configure metrics instead" $key) -}}
{{- end -}}
{{- end -}}

{{- if not (kindIs "bool" .Values.metrics.enabled) -}}
{{- fail "metrics.enabled must be a boolean" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.metrics.serviceMonitor.enabled) -}}
{{- fail "metrics.serviceMonitor.enabled must be a boolean" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.metrics.prometheusRule.enabled) -}}
{{- fail "metrics.prometheusRule.enabled must be a boolean" -}}
{{- end -}}
{{- range $key := list "serviceMonitor" "prometheusRule" -}}
{{- if not (kindIs "map" (index $.Values.metrics $key).additionalLabels) -}}
{{- fail (printf "metrics.%s.additionalLabels must be a map" $key) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "interval" "scrapeTimeout" -}}
{{- $value := index $.Values.metrics.serviceMonitor $key -}}
{{- if or (not (kindIs "string" $value)) (not (regexMatch "^([1-9][0-9]*(ms|s|m|h|d|w|y))([0-9]+(ms|s|m|h|d|w|y))*$" $value)) -}}
{{- fail (printf "metrics.serviceMonitor.%s must be a positive Prometheus duration" $key) -}}
{{- end -}}
{{- end -}}
{{- $metricsRuleFor := index .Values.metrics.prometheusRule "for" -}}
{{- if or (not (kindIs "string" $metricsRuleFor)) (not (regexMatch "^([1-9][0-9]*(ms|s|m|h|d|w|y))([0-9]+(ms|s|m|h|d|w|y))*$" $metricsRuleFor)) -}}
{{- fail "metrics.prometheusRule.for must be a positive Prometheus duration" -}}
{{- end -}}
{{- if and .Values.metrics.serviceMonitor.enabled (not .Values.metrics.enabled) -}}
{{- fail "metrics.serviceMonitor.enabled requires metrics.enabled=true" -}}
{{- end -}}
{{- if and .Values.metrics.prometheusRule.enabled (not .Values.metrics.enabled) -}}
{{- fail "metrics.prometheusRule.enabled requires metrics.enabled=true" -}}
{{- end -}}

{{- $postgresMaxConnections := int .Values.postgres.maxConnections -}}
{{- $postgresReservedConnections := int .Values.postgres.reservedConnections -}}
{{- $poolMaxPerApiPod := int .Values.postgres.poolMaxPerApiPod -}}
{{- if lt $postgresMaxConnections 1 -}}
{{- fail "postgres.maxConnections must be greater than zero" -}}
{{- end -}}
{{- if lt $postgresReservedConnections 0 -}}
{{- fail "postgres.reservedConnections must be zero or greater" -}}
{{- end -}}
{{- if ge $postgresReservedConnections $postgresMaxConnections -}}
{{- fail "postgres.reservedConnections must be less than postgres.maxConnections" -}}
{{- end -}}
{{- if lt $poolMaxPerApiPod 1 -}}
{{- fail "postgres.poolMaxPerApiPod must be greater than zero" -}}
{{- end -}}
{{- $backendReplicas := int .Values.replicaCount.backend -}}
{{- $executionReplicas := int .Values.replicaCount.execution -}}
{{- if .Values.autoscaling.execution.enabled -}}
{{- $executionReplicas = int .Values.autoscaling.execution.maxReplicas -}}
{{- end -}}
{{- $apiPodConnections := add $poolMaxPerApiPod 3 -}}
{{- $requiredPostgresConnections := add $postgresReservedConnections (mul (add $backendReplicas $executionReplicas) $apiPodConnections) -}}
{{- if gt $requiredPostgresConnections $postgresMaxConnections -}}
{{- fail (printf "PostgreSQL capacity is too small: the chart requires %d connections (%d reserved + %d API pods * (%d pooled + 3 LISTEN)), but postgres.maxConnections is %d; raise database capacity, lower postgres.poolMaxPerApiPod, or lower execution autoscaling.maxReplicas" $requiredPostgresConnections $postgresReservedConnections (add $backendReplicas $executionReplicas) $poolMaxPerApiPod $postgresMaxConnections) -}}
{{- end -}}

{{- range $key := list "RIVET_MANAGED_MAINTENANCE_ENABLED" "RIVET_MANAGED_MAINTENANCE_INTERVAL_MS" "RIVET_MANAGED_MAINTENANCE_LEASE_MS" "RIVET_MANAGED_MAINTENANCE_BATCH_SIZE" -}}
{{- if hasKey $.Values.env $key -}}
{{- fail (printf "env.%s is chart-owned; configure managedMaintenance instead" $key) -}}
{{- end -}}
{{- end -}}

{{- $managedMaintenanceIntervalMs := int .Values.managedMaintenance.intervalMs -}}
{{- if or (lt $managedMaintenanceIntervalMs 15000) (gt $managedMaintenanceIntervalMs 86400000) -}}
{{- fail "managedMaintenance.intervalMs must be an integer between 15000 and 86400000" -}}
{{- end -}}
{{- $managedMaintenanceLeaseMs := int .Values.managedMaintenance.leaseMs -}}
{{- if or (lt $managedMaintenanceLeaseMs 15000) (gt $managedMaintenanceLeaseMs 600000) -}}
{{- fail "managedMaintenance.leaseMs must be an integer between 15000 and 600000" -}}
{{- end -}}
{{- $managedMaintenanceBatchSize := int .Values.managedMaintenance.batchSize -}}
{{- if or (lt $managedMaintenanceBatchSize 1) (gt $managedMaintenanceBatchSize 500) -}}
{{- fail "managedMaintenance.batchSize must be an integer between 1 and 500" -}}
{{- end -}}

{{- if lt (int .Values.workflowSchema.migrationJob.backoffLimit) 0 -}}
{{- fail "workflowSchema.migrationJob.backoffLimit must be zero or greater" -}}
{{- end -}}

{{- if lt (int .Values.workflowSchema.migrationJob.activeDeadlineSeconds) 1 -}}
{{- fail "workflowSchema.migrationJob.activeDeadlineSeconds must be greater than zero" -}}
{{- end -}}

{{- $schemaMinimumVersion := int .Values.workflowSchema.compatibility.minimumVersion -}}
{{- $schemaMaximumVersion := int .Values.workflowSchema.compatibility.maximumVersion -}}
{{- if lt $schemaMinimumVersion 1 -}}
{{- fail "workflowSchema.compatibility.minimumVersion must be greater than zero" -}}
{{- end -}}
{{- if lt $schemaMaximumVersion $schemaMinimumVersion -}}
{{- fail "workflowSchema.compatibility.maximumVersion must be greater than or equal to minimumVersion" -}}
{{- end -}}
{{- range $key := list "RIVET_HEALTH_REFRESH_SECONDS" "RIVET_HEALTH_CHECK_TIMEOUT_SECONDS" "RIVET_HEALTH_STALE_AFTER_SECONDS" "RIVET_SHUTDOWN_GRACE_SECONDS" "RIVET_DEPLOYMENT_HEALTH_REFRESH_SECONDS" "RIVET_DEPLOYMENT_HEALTH_CHECK_TIMEOUT_SECONDS" "RIVET_DEPLOYMENT_HEALTH_STALE_AFTER_SECONDS" "RIVET_DEPLOYMENT_SHUTDOWN_GRACE_SECONDS" -}}
{{- if hasKey $.Values.env $key -}}
{{- fail (printf "env.%s is chart-owned; configure lifecycle values instead" $key) -}}
{{- end -}}
{{- end -}}

{{- if lt (int .Values.lifecycle.health.refreshSeconds) 1 -}}
{{- fail "lifecycle.health.refreshSeconds must be greater than zero" -}}
{{- end -}}
{{- if lt (int .Values.lifecycle.health.checkTimeoutSeconds) 1 -}}
{{- fail "lifecycle.health.checkTimeoutSeconds must be greater than zero" -}}
{{- end -}}
{{- if le (int .Values.lifecycle.health.staleAfterSeconds) (add (int .Values.lifecycle.health.refreshSeconds) (int .Values.lifecycle.health.checkTimeoutSeconds)) -}}
{{- fail "lifecycle.health.staleAfterSeconds must be greater than refreshSeconds plus checkTimeoutSeconds" -}}
{{- end -}}
{{- if lt (int .Values.lifecycle.shutdownGraceSeconds) 1 -}}
{{- fail "lifecycle.shutdownGraceSeconds must be greater than zero" -}}
