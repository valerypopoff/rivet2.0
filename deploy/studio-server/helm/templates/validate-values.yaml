{{- if lt (int .Values.lifecycle.preStopDelaySeconds) 0 -}}
{{- fail "lifecycle.preStopDelaySeconds must be zero or greater" -}}
{{- end -}}
{{- if lt (int .Values.lifecycle.terminationGracePeriodSeconds) (add (int .Values.lifecycle.shutdownGraceSeconds) (int .Values.lifecycle.preStopDelaySeconds) 25) -}}
{{- fail "lifecycle.terminationGracePeriodSeconds must allow shutdownGraceSeconds, preStopDelaySeconds, and a 25-second finalization margin" -}}
{{- end -}}
{{- range $name, $probe := .Values.lifecycle.probes -}}
{{- if or (lt (int $probe.periodSeconds) 1) (lt (int $probe.timeoutSeconds) 1) (lt (int $probe.failureThreshold) 1) -}}
{{- fail (printf "lifecycle.probes.%s periodSeconds, timeoutSeconds, and failureThreshold must be greater than zero" $name) -}}
{{- end -}}
{{- end -}}
{{- if .Values.availability.topologySpread.enabled -}}
{{- if not (has .Values.availability.topologySpread.whenUnsatisfiable (list "ScheduleAnyway" "DoNotSchedule")) -}}
{{- fail "availability.topologySpread.whenUnsatisfiable must be ScheduleAnyway or DoNotSchedule" -}}
{{- end -}}
{{- if lt (int .Values.availability.topologySpread.maxSkew) 1 -}}
{{- fail "availability.topologySpread.maxSkew must be greater than zero" -}}
{{- end -}}
{{- if empty .Values.availability.topologySpread.topologyKey -}}
{{- fail "availability.topologySpread.topologyKey is required" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.availability.podAntiAffinity.enabled (empty .Values.availability.podAntiAffinity.topologyKey) -}}
{{- fail "availability.podAntiAffinity.topologyKey is required" -}}
