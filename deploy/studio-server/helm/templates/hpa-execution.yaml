{{- if and .Values.autoscaling.execution.enabled (not .Values.autoscaling.executionController.enabled) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rivet.executionName" . }}
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: execution
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ ternary "StatefulSet" "Deployment" .Values.ha.enabled }}
    name: {{ include "rivet.executionName" . }}
  minReplicas: {{ .Values.autoscaling.execution.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.execution.maxReplicas }}
  {{- if .Values.ha.enabled }}
  # Automatic scale-down would terminate an accepted owner without its handshake.
  # Add capacity automatically; remove capacity only through owned retirement.
  behavior:
    scaleDown:
      selectPolicy: Disabled
  {{- end }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.execution.targetCPUUtilizationPercentage }}
{{- end }}
