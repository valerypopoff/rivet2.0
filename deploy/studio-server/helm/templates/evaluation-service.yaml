{{- if and .Values.compatibility.legacyStartupSettingsFiles .Values.hostedEvaluations.enabled }}
# Internal-only Service for health/metrics discovery. Neither the external
# gateway nor the embedded proxy routes product-facing workflow traffic here.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rivet.evaluationServiceName" . }}
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluation
spec:
  type: ClusterIP
  {{- if eq .Values.deploymentProfile "single-machine" }}
  # Role startup/restore probes must remain reachable while peers warm up.
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    {{- include "rivet.serviceSelector" (dict "root" . "component" "evaluation") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.evaluation.port }}
      targetPort: evaluation-http
{{- end }}
