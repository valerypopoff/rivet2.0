{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rivet.fullname" . }}-api-metrics
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rivet.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | quote }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rivet.fullname" . }}-execution-metrics
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rivet.componentLabels" (dict "root" . "component" "execution") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
{{- if and .Values.metrics.serviceMonitor.enabled .Values.metrics.proxyExporter.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rivet.fullname" . }}-proxy-metrics
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rivet.componentLabels" (dict "root" . "component" "proxy") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
{{- if and .Values.metrics.serviceMonitor.enabled .Values.hostedEvaluations.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rivet.fullname" . }}-evaluation-metrics
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rivet.componentLabels" (dict "root" . "component" "evaluation") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "rivet.fullname" . }}-metrics
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "rivet.fullname" . }}.metrics
      rules:
        - alert: RivetExecutionReadinessUnavailable
          expr: max by (namespace, pod) (rivet_runtime_readiness{profile="execution"}) == 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: A Rivet execution API pod is not ready.
        - alert: RivetPublishedExecutionAdmissionSaturated
          expr: rivet_published_execution_active_runs{profile="execution"} >= ignoring(mode) rivet_published_execution_admission_limit{profile="execution",mode="enforce"}
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: A Rivet execution API pod has reached its configured public-run limit.
        - alert: RivetRecordingPersistenceDrops
          expr: increase(rivet_workflow_recording_persistence_dropped_total{profile="execution"}[10m]) > 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: Rivet dropped one or more recording persistence writes.
        - alert: RivetObjectStorageOperationErrors
          expr: sum by (profile, domain) (increase(rivet_object_storage_operations_total{outcome="error"}[10m])) > 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: Rivet object storage reported an operation error.
        {{- if .Values.metrics.prometheusRule.failureModeAlerts.enabled }}
        - alert: RivetPostgresPoolWaiters
          expr: sum by (namespace, pod, profile) (rivet_postgres_pool_connections{state="waiting"}) >= {{ .Values.metrics.prometheusRule.failureModeAlerts.postgresPoolWaiting }}
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: A Rivet API process has PostgreSQL pool waiters.
        - alert: RivetRuntimeLibraryJobFailures
          expr: sum by (namespace, pod, profile) (increase(rivet_runtime_library_jobs_total{outcome="failed"}[10m])) > 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: Rivet runtime-library work failed.
        - alert: RivetManagedMaintenanceStale
          expr: time() - max by (namespace, pod) (rivet_managed_maintenance_last_success_timestamp_seconds{profile="control"}) > {{ .Values.metrics.prometheusRule.failureModeAlerts.maintenanceStaleSeconds }}
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: Rivet managed maintenance has not completed within its expected window.
        - alert: RivetManagedDeletionOutboxBlocked
          expr: sum by (namespace) (rivet_managed_object_deletion_outbox_entries{state="blocked",profile="control"}) >= {{ .Values.metrics.prometheusRule.failureModeAlerts.outboxBlockedEntries }}
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: Rivet has object-deletion outbox entries blocked by a remaining durable reference.
        - alert: RivetHostedEvaluationQueueSaturated
          expr: (sum by (namespace) (rivet_hosted_evaluation_jobs_outstanding{state=~"queued|claimed|accepted"}) / clamp_min(sum by (namespace) (rivet_hosted_evaluation_jobs_outstanding_limit), 1)) >= {{ .Values.metrics.prometheusRule.failureModeAlerts.evaluationQueueUtilization }}
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: Rivet hosted Evaluation work is nearing its configured outstanding-job limit.
        - alert: RivetAppSettingsReplicaSynchronizationStale
          expr: sum by (namespace, profile) (time() - rivet_managed_settings_last_success_timestamp_seconds > {{ .Values.metrics.prometheusRule.failureModeAlerts.maintenanceStaleSeconds }}) > 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: One or more Rivet API replicas have not refreshed their managed App Settings revision within the expected window.
        {{- end }}
        {{- if .Values.metrics.prometheusRule.clusterStateAlerts.enabled }}
        - alert: RivetPublishedExecutionContainerRestarts
          expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"{{ include "rivet.fullname" . }}-(proxy|execution)-.*"}[10m])) >= {{ .Values.metrics.prometheusRule.clusterStateAlerts.restartIncrease }}
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: warning
          annotations:
            summary: A Rivet proxy or published-execution container restarted.
        - alert: RivetPublishedExecutionContainerOOMKilled
          expr: max by (namespace, pod) (kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}",pod=~"{{ include "rivet.fullname" . }}-(proxy|execution)-.*",reason="OOMKilled"}) > 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: critical
          annotations:
            summary: A Rivet proxy or published-execution container was OOM killed.
        - alert: RivetPublishedExecutionPodEvicted
          expr: max by (namespace, pod) (kube_pod_status_reason{namespace="{{ .Release.Namespace }}",pod=~"{{ include "rivet.fullname" . }}-(proxy|execution)-.*",reason="Evicted"}) > 0
          for: {{ index .Values.metrics.prometheusRule "for" | quote }}
          labels:
            severity: critical
          annotations:
            summary: A Rivet proxy or published-execution pod was evicted.
        {{- end }}
{{- end }}
