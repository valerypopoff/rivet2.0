apiVersion: v1
kind: Service
metadata:
  name: {{ include "rivet.executionServiceName" . }}
  {{- if .Values.ha.executionPools.enabled }}
  annotations:
    rivet.dev/active-execution-workload: {{ printf "%s%s" (include "rivet.executionName" .) (ternary "-next" "" (eq .Values.ha.executionPools.active "b")) | quote }}
  {{- end }}
  labels:
    {{- include "rivet.labels" . | nindent 4 }}
    app.kubernetes.io/component: execution
spec:
  type: ClusterIP
  {{- if eq .Values.deploymentProfile "single-machine" }}
  # Role startup/restore probes must remain reachable while peers warm up.
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    {{- include "rivet.serviceSelector" (dict "root" . "component" "execution") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.execution.port }}
      targetPort: execution-http
