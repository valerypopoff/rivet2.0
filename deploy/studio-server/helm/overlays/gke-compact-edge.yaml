# Optional reduced-redundancy edge. Merge AFTER gke-ha.yaml and, for five total
# steady-state pods, gke-runtime-ha.yaml. No production qualification implied.
availability:
  gkeGatewayProfile: compact
  topologySpread:
    minDomains: 1
replicaCount:
  proxy: 1
autoscaling:
  proxy:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
