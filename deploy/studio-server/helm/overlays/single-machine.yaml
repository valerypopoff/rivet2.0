# Same API roles, schema Job, storage and release gates; no availability claim.
# Dependencies are owned by the single-machine launcher, not this Helm release.
deploymentProfile: single-machine
service:
  api:
    targetPort: 8081
  execution:
    targetPort: 8082
gateway:
  mode: embedded
ingress:
  enabled: false
vault:
  enabled: false
replicaCount:
  proxy: 1
  web: 1
  backend: 1
  execution: 1
autoscaling:
  proxy:
    enabled: false
  execution:
    enabled: false
publishedExecutionAdmission:
  mode: enforce
  maxActiveRunsPerPod: 4
  retryAfterSeconds: 1
hostedEvaluations:
  enabled: true
  workerConcurrency: 1
  maxJobsPerRun: 2000
  maxOutstandingJobs: 10000
  # Trials share the editor backend; they do not create another role container.
legacyRestore:
  enabled: true
resourceLimitAcknowledgements:
  proxy:
    memory: 'Single-machine proxy memory cap awaits representative installation measurements.'
    ephemeralStorage: 'Single-machine proxy scratch cap awaits representative installation measurements.'
