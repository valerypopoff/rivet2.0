# Shared low-capacity policy. An environment values file must supply storage,
# credentials and any gateway/Ingress integration; examples are not defaults.
gateway:
  mode: external
ingress:
  enabled: false

workflowStorage:
  backend: managed

runtimeLibraries:
  backend: managed
  cache:
    enabled: false

postgres:
  mode: managed
  maxConnections: 100
  reservedConnections: 30
  poolMaxPerApiPod: 10
  sslMode: require

replicaCount:
  proxy: 1
  web: 1
  backend: 1
  execution: 1

autoscaling:
  proxy:
    enabled: false
  web:
    enabled: false
  backend:
    enabled: false
  execution:
    enabled: false
