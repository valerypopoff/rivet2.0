x-dev-stack-labels: &dev-stack-labels
  com.valerypopoff.rivet2.dev-stack-input-fingerprint: ${RIVET_DEV_STACK_INPUT_FINGERPRINT:-}

services:
  workflow-postgres:
    labels: *dev-stack-labels
    profiles: ["workflow-managed"]
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${RIVET_WORKFLOWS_LOCAL_DOCKER_POSTGRES_DB:-rivet}
      - POSTGRES_USER=${RIVET_WORKFLOWS_LOCAL_DOCKER_POSTGRES_USER:-rivet}
      - POSTGRES_PASSWORD=${RIVET_WORKFLOWS_LOCAL_DOCKER_POSTGRES_PASSWORD:-rivet}
    ports:
      - "${RIVET_LOCAL_BIND_HOST:-127.0.0.1}:${RIVET_WORKFLOWS_LOCAL_DOCKER_POSTGRES_PORT:-54329}:5432"
    volumes:
      - workflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RIVET_WORKFLOWS_LOCAL_DOCKER_POSTGRES_USER:-rivet} -d ${RIVET_WORKFLOWS_LOCAL_DOCKER_POSTGRES_DB:-rivet}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  workflow-minio:
    labels: *dev-stack-labels
    profiles: ["workflow-managed"]
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4
    # The local named volume is root-owned on first creation; this fixture must
    # be able to write it even though the image defaults to an unprivileged user.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${RIVET_WORKFLOWS_LOCAL_DOCKER_OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${RIVET_WORKFLOWS_LOCAL_DOCKER_OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${RIVET_LOCAL_BIND_HOST:-127.0.0.1}:${RIVET_WORKFLOWS_LOCAL_DOCKER_OBJECT_STORAGE_PORT:-9000}:9000"
      - "${RIVET_LOCAL_BIND_HOST:-127.0.0.1}:${RIVET_WORKFLOWS_LOCAL_DOCKER_OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - workflow_minio_data:/data
    restart: unless-stopped

volumes:
  workflow_postgres_data:
    driver: local
  workflow_minio_data:
    driver: local
