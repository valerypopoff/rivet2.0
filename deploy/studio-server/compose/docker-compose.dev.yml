x-dev-stack-labels: &dev-stack-labels
  com.valerypopoff.rivet2.dev-stack-input-fingerprint: ${RIVET_DEV_STACK_INPUT_FINGERPRINT:-}

services:
  proxy:
    labels: *dev-stack-labels
    image: nginx:alpine
    ports:
      - '${RIVET_PORT:-8080}:80'
    environment:
      - RIVET_PUBLISHED_WORKFLOWS_BASE_PATH=${RIVET_PUBLISHED_WORKFLOWS_BASE_PATH:-/workflows}
      - RIVET_LATEST_WORKFLOWS_BASE_PATH=${RIVET_LATEST_WORKFLOWS_BASE_PATH:-/workflows-latest}
      - RIVET_APP_DATA_ROOT=/data/rivet-app
      - RIVET_PUBLISHED_APPS_BASE_PATH=${RIVET_PUBLISHED_APPS_BASE_PATH:-}
      - RIVET_LATEST_APPS_BASE_PATH=${RIVET_LATEST_APPS_BASE_PATH:-}
      - RIVET_WEB_APPS_BASE_PATH=${RIVET_WEB_APPS_BASE_PATH:-/apps}
      - RIVET_LATEST_WEB_APPS_BASE_PATH=${RIVET_LATEST_WEB_APPS_BASE_PATH:-/apps-latest}
      - RIVET_KEY=${RIVET_KEY:-}
      - RIVET_TRUST_INCOMING_FORWARDED_HEADERS=${RIVET_TRUST_INCOMING_FORWARDED_HEADERS:-false}
      - RIVET_TRUSTED_FORWARDING_PROXIES=${RIVET_TRUSTED_FORWARDING_PROXIES:-}
    volumes:
      - ./nginx/default.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../images/proxy/normalize-workflow-paths.sh:/normalize-workflow-paths.sh:ro
      - ../images/proxy/client-address.sh:/opt/rivet/proxy/client-address.sh:ro
      - ../images/proxy/healthcheck-dev.sh:/healthcheck-dev.sh:ro
      - type: volume
        source: rivet_data
        target: /data/rivet-app
        read_only: true
        volume:
          nocopy: true
    entrypoint: ['/bin/sh', '/normalize-workflow-paths.sh']
    healthcheck:
      test: ['CMD', '/bin/sh', '/healthcheck-dev.sh']
      interval: 10s
      timeout: 12s
      retries: 3
      start_period: 30s
    depends_on:
      web:
        condition: service_healthy
        # Frontend mode changes must not restart nginx and disconnect executor
        # sockets. The dev launcher gracefully reloads nginx after readiness to
        # resolve this upstream's new bridge address without retiring sessions.
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  web:
    labels: *dev-stack-labels
    image: node:20-alpine
    init: true
    working_dir: /workspace/packages/studio-server-web
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - all_proxy=${all_proxy:-${ALL_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-}}
      - HOME=/home/rivet
      - npm_config_cache=/home/rivet/.npm
      - YARN_CACHE_FOLDER=/home/rivet/.cache/yarn
      - YARN_NODE_LINKER=node-modules
      - YARN_CHECKSUM_BEHAVIOR=ignore
      - YARN_INSTALL_STATE_PATH=/workspace/node_modules/.yarn-install-state.gz
      - HOSTED_VITE_CACHE_DIR=/home/rivet/.cache/vite
      - RIVET_DEV_FRONTEND_MODE=${RIVET_DEV_FRONTEND_MODE:-live}
      - RIVET_DEV_BUNDLE_ROOT=/home/rivet/.cache/tunnel
      - VITE_RIVET_DEBUG_LOGS=${VITE_RIVET_DEBUG_LOGS:-false}
      - RIVET_PUBLISHED_WORKFLOWS_BASE_PATH=${RIVET_PUBLISHED_WORKFLOWS_BASE_PATH:-/workflows}
      - RIVET_LATEST_WORKFLOWS_BASE_PATH=${RIVET_LATEST_WORKFLOWS_BASE_PATH:-/workflows-latest}
      - RIVET_PUBLISHED_APPS_BASE_PATH=${RIVET_PUBLISHED_APPS_BASE_PATH:-}
      - RIVET_LATEST_APPS_BASE_PATH=${RIVET_LATEST_APPS_BASE_PATH:-}
      - RIVET_WEB_APPS_BASE_PATH=${RIVET_WEB_APPS_BASE_PATH:-/apps}
      - RIVET_LATEST_WEB_APPS_BASE_PATH=${RIVET_LATEST_WEB_APPS_BASE_PATH:-/apps-latest}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ../../..:/workspace
      - web_node_modules:/workspace/node_modules
      - web_yarn_unplugged:/workspace/.yarn/unplugged
      - npm_cache:/home/rivet/.npm
      - yarn_cache:/home/rivet/.cache/yarn
      - vite_cache:/home/rivet/.cache/vite
      - tunnel_cache:/home/rivet/.cache/tunnel
      - ./docker/preserve-host-pnp-during-command.sh:/tmp/preserve-host-pnp-during-command.sh:ro
    command: >
      sh -lc "
        corepack enable &&
        cd /workspace &&
        if [ ! -f node_modules/.studio-server-yarn-install-ok ] || [ ! -f node_modules/.yarn.lock ] || ! cmp -s yarn.lock node_modules/.yarn.lock; then
          sh /tmp/preserve-host-pnp-during-command.sh /workspace env YARN_NODE_LINKER=node-modules YARN_CHECKSUM_BEHAVIOR=ignore yarn install --immutable &&
          cp yarn.lock node_modules/.yarn.lock &&
          touch node_modules/.studio-server-yarn-install-ok;
        fi &&
        yarn build:hosted-web-deps &&
        if [ $$RIVET_DEV_FRONTEND_MODE = tunnel ]; then
          yarn workspace @valerypopoff/rivet-studio-server-web run check:google-hosted-override &&
          yarn workspace @valerypopoff/rivet-studio-server-web exec node dev/tunnel.mjs;
        else
          yarn workspace @valerypopoff/rivet-studio-server-web run dev --host 0.0.0.0 --strictPort;
        fi
      "
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get('http://127.0.0.1:5174/', (res) => process.exit(res.statusCode && res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      start_period: ${RIVET_DEV_WEB_START_PERIOD:-180s}
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  filesystem-artifacts-init:
    labels: *dev-stack-labels
    image: node:20-alpine
    user: '0:0'
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for directory in /workflows /workflow-recordings /data/runtime-libraries /data/rivet-app /data/local-metadata; do
          mkdir -p "$$directory"
          if [ "$$(stat -c '%u:%g' "$$directory")" != "10001:10001" ]; then
            find "$$directory" -xdev -exec chown -h 10001:10001 {} +
          fi
        done
    volumes:
      - ${RIVET_WORKFLOWS_HOST_PATH:-../../../.data/workflows}:/workflows
      - ${RIVET_WORKFLOW_RECORDINGS_HOST_PATH:-../../../.data/workflow-recordings}:/workflow-recordings
      - ${RIVET_RUNTIME_LIBS_HOST_PATH:-../../../.data/runtime-libraries}:/data/runtime-libraries
      - rivet_local_metadata:/data/local-metadata
      - type: volume
        source: rivet_data
        target: /data/rivet-app
        volume:
          nocopy: true
    restart: 'no'
  api:
    labels: *dev-stack-labels
    # The production image entrypoint serves the built API. Development must run
    # this Compose command instead, so source watching and dependency markers work.
    entrypoint: []
    build:
      context: ../../..
      dockerfile: deploy/studio-server/compose/docker/Dockerfile.api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        all_proxy: ${all_proxy:-${ALL_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
    depends_on:
      web:
        condition: service_healthy
      filesystem-artifacts-init:
        condition: service_completed_successfully
    user: '0:0'
    working_dir: /workspace
    ports:
      - '${RIVET_LOCAL_BIND_HOST:-127.0.0.1}:${RIVET_API_PORT:-3100}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - all_proxy=${all_proxy:-${ALL_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-}}
      - HOME=/home/rivet
      - npm_config_cache=/home/rivet/.npm
      - YARN_CACHE_FOLDER=/home/rivet/.cache/yarn
      - YARN_NODE_LINKER=node-modules
      - YARN_CHECKSUM_BEHAVIOR=ignore
      - YARN_INSTALL_STATE_PATH=/workspace/node_modules/.yarn-install-state.gz
      - PORT=80
      - RIVET_DEPLOYMENT_TOPOLOGY=single-host
      - RIVET_BACKEND_API_PORT=80
      - RIVET_BACKEND_EXECUTOR_PORT=21889
      - RIVET_BACKEND_HEALTH_PORT=21890
      - RIVET_WORKSPACE_ROOT=/workspace
      - RIVET_WORKFLOWS_ROOT=/workflows
      - RIVET_WORKFLOW_RECORDINGS_ROOT=/workflow-recordings
      - RIVET_APP_DATA_ROOT=/data/rivet-app
      - RIVET_RUNTIME_LIBRARIES_ROOT=/data/runtime-libraries
      - RIVET_RUNTIME_PROCESS_ROLE=api
      # Pull-only metrics stay on this direct internal API service; proxy does not route /metrics.
      - RIVET_METRICS_ENABLED=${RIVET_METRICS_ENABLED:-false}
      - RIVET_RECORDING_INPUT_CACHE_MAX_MIB=${RIVET_RECORDING_INPUT_CACHE_MAX_MIB:-32}
      - RIVET_WEB_APP_BROWSER_STORAGE_TRANSFER_TIMEOUT_MS=${RIVET_WEB_APP_BROWSER_STORAGE_TRANSFER_TIMEOUT_MS:-60000}
      - RIVET_WEB_APP_BROWSER_STORAGE_MAX_VALUE_BYTES=${RIVET_WEB_APP_BROWSER_STORAGE_MAX_VALUE_BYTES:-268435456}
      - RIVET_WEB_APP_BROWSER_STORAGE_MAX_ACTION_BYTES=${RIVET_WEB_APP_BROWSER_STORAGE_MAX_ACTION_BYTES:-536870912}
      - RIVET_WEB_APP_BROWSER_STORAGE_MAX_ACTIVE_BYTES=${RIVET_WEB_APP_BROWSER_STORAGE_MAX_ACTIVE_BYTES:-536870912}
      - RIVET_KEY=${RIVET_KEY:-}
      - RIVET_SERVER_UI_AUTH_MODE=${RIVET_SERVER_UI_AUTH_MODE:-}
      - RIVET_VM_MIGRATION_ENABLED=${RIVET_VM_MIGRATION_ENABLED:-0}
      - RIVET_LOCAL_METADATA_UPGRADE_ENABLED=${RIVET_LOCAL_METADATA_UPGRADE_ENABLED:-0}
      - RIVET_LOCAL_METADATA_CONTROL_ROOT=${RIVET_LOCAL_METADATA_CONTROL_ROOT:-}
      - RIVET_LOCAL_METADATA_UI_ROOT=/data/local-metadata
      - RIVET_LOCAL_METADATA_ENCRYPTION_KEY=${RIVET_LOCAL_METADATA_ENCRYPTION_KEY:-}
      - RIVET_LOCAL_METADATA_MAX_BUNDLE_MIB=${RIVET_LOCAL_METADATA_MAX_BUNDLE_MIB:-32}
      - RIVET_ENABLE_DEVELOPMENT_AUTH=${RIVET_ENABLE_DEVELOPMENT_AUTH:-false}
      - RIVET_DEVELOPMENT_AUTH_CLIENTS=${RIVET_DEVELOPMENT_AUTH_CLIENTS:-}
      - RIVET_REQUIRE_UI_GATE_KEY=${RIVET_REQUIRE_UI_GATE_KEY:-false}
      - RIVET_PUBLISHED_WORKFLOWS_BASE_PATH=${RIVET_PUBLISHED_WORKFLOWS_BASE_PATH:-/workflows}
      - RIVET_LATEST_WORKFLOWS_BASE_PATH=${RIVET_LATEST_WORKFLOWS_BASE_PATH:-/workflows-latest}
      - RIVET_PUBLISHED_APPS_BASE_PATH=${RIVET_PUBLISHED_APPS_BASE_PATH:-}
      - RIVET_LATEST_APPS_BASE_PATH=${RIVET_LATEST_APPS_BASE_PATH:-}
      - RIVET_WEB_APPS_BASE_PATH=${RIVET_WEB_APPS_BASE_PATH:-/apps}
      - RIVET_LATEST_WEB_APPS_BASE_PATH=${RIVET_LATEST_WEB_APPS_BASE_PATH:-/apps-latest}
      - RIVET_RUNTIME_LIBRARIES_SYNC_POLL_INTERVAL_MS
      - RIVET_NODE_EXECUTOR_PROXY_SETTINGS_POLL_INTERVAL_MS
      - RIVET_NODE_EXECUTOR_PROXY_BYPASS_HOSTS=${RIVET_NODE_EXECUTOR_PROXY_BYPASS_HOSTS:-}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - RIVET_CORS_ALLOWED_ORIGINS=${RIVET_CORS_ALLOWED_ORIGINS:-}
      - RIVET_ENV_ALLOWLIST=${RIVET_ENV_ALLOWLIST:-}
      - RIVET_SHELL_ALLOWLIST=${RIVET_SHELL_ALLOWLIST:-}
      - RIVET_EXTRA_ROOTS=${RIVET_EXTRA_ROOTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID:-}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
    volumes:
      - ../../..:/workspace
      - api_node_modules:/workspace/node_modules
      - api_yarn_unplugged:/workspace/.yarn/unplugged
      - npm_cache:/home/rivet/.npm
      - yarn_cache:/home/rivet/.cache/yarn
      - ./docker/preserve-host-pnp-during-command.sh:/tmp/preserve-host-pnp-during-command.sh:ro
      - ${RIVET_WORKFLOWS_HOST_PATH:-../../../.data/workflows}:/workflows
      - ${RIVET_WORKFLOW_RECORDINGS_HOST_PATH:-../../../.data/workflow-recordings}:/workflow-recordings
      - type: volume
        source: rivet_data
        target: /data/rivet-app
        volume:
          nocopy: true
      - type: volume
        source: rivet_data
        target: /home/rivet/.local/share/com.valerypopoff.rivet2
        volume:
          nocopy: true
      - ${RIVET_RUNTIME_LIBS_HOST_PATH:-../../../.data/runtime-libraries}:/data/runtime-libraries
      - rivet_local_metadata:/data/local-metadata
    command: >
      sh -lc "
        corepack enable &&
        cd /workspace &&
        if [ ! -f node_modules/.studio-server-yarn-install-ok ] || [ ! -f node_modules/.yarn.lock ] || ! cmp -s yarn.lock node_modules/.yarn.lock; then
          sh /tmp/preserve-host-pnp-during-command.sh /workspace env YARN_NODE_LINKER=node-modules YARN_CHECKSUM_BEHAVIOR=ignore yarn install --immutable &&
          cp yarn.lock node_modules/.yarn.lock &&
          touch node_modules/.studio-server-yarn-install-ok;
        fi &&
        yarn build:runtime &&
        yarn workspace @valerypopoff/rivet2-evaluations run build &&
        node /workspace/deploy/studio-server/scripts/dev-backend-supervisor.mjs
      "
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get('http://127.0.0.1:21890/readyz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      start_period: 360s
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 150s
    restart: unless-stopped

volumes:
  rivet_local_metadata:
    driver: local
  web_node_modules:
    driver: local
  web_yarn_unplugged:
    driver: local
  api_node_modules:
    driver: local
  api_yarn_unplugged:
    driver: local
  npm_cache:
    driver: local
  yarn_cache:
    driver: local
  vite_cache:
    driver: local
  tunnel_cache:
    driver: local
  rivet_data:
    driver: local
  rivet_runtime_libs:
    driver: local
