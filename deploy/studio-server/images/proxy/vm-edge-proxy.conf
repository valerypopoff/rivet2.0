proxy_pass http://127.0.0.1:18081;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Replace, rather than append to, any client-supplied forwarding chain.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Rivet-Proxy-Auth "";
proxy_set_header X-Rivet-Executor-Auth "";
proxy_set_header X-Rivet-Client-IP "";
proxy_set_header X-Rivet-Token-Free-Host "";
proxy_set_header X-Rivet-Correlation-Id "";
proxy_set_header X-Rivet-Ui-Return-To "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 180s;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
