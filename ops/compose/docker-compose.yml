services:
  proxy:
    image: ${RIVET_PROXY_IMAGE:-ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/proxy:${RIVET_IMAGE_TAG:-latest}}
    build:
      context: ../..
      dockerfile: image/proxy/Dockerfile
    ports:
      - "${RIVET_PORT:-8080}:8080"
    environment:
      - RIVET_WEB_UPSTREAM_HOST=web
      - RIVET_WEB_UPSTREAM_PORT=3000
      - RIVET_API_UPSTREAM_HOST=api
      - RIVET_API_UPSTREAM_PORT=80
      - RIVET_EXECUTION_UPSTREAM_HOST=api
      - RIVET_EXECUTION_UPSTREAM_PORT=80
      - RIVET_EXECUTOR_UPSTREAM_HOST=executor
      - RIVET_EXECUTOR_UPSTREAM_PORT=21889
      - RIVET_PROXY_RESOLVER=${RIVET_PROXY_RESOLVER:-127.0.0.11}
      - RIVET_APP_DATA_ROOT=/data/rivet-app
      - RIVET_PUBLISHED_WORKFLOWS_BASE_PATH=${RIVET_PUBLISHED_WORKFLOWS_BASE_PATH:-/workflows}
      - RIVET_LATEST_WORKFLOWS_BASE_PATH=${RIVET_LATEST_WORKFLOWS_BASE_PATH:-/workflows-latest}
      - RIVET_PUBLISHED_APPS_BASE_PATH=${RIVET_PUBLISHED_APPS_BASE_PATH:-}
      - RIVET_LATEST_APPS_BASE_PATH=${RIVET_LATEST_APPS_BASE_PATH:-}
      - RIVET_WEB_APPS_BASE_PATH=${RIVET_WEB_APPS_BASE_PATH:-/apps}
      - RIVET_LATEST_WEB_APPS_BASE_PATH=${RIVET_LATEST_WEB_APPS_BASE_PATH:-/apps-latest}
      - RIVET_PROXY_READ_TIMEOUT=${RIVET_PROXY_READ_TIMEOUT:-180s}
      - RIVET_KEY=${RIVET_KEY:-}
      - RIVET_REQUIRE_UI_GATE_KEY=${RIVET_REQUIRE_UI_GATE_KEY:-false}
      - RIVET_TRUST_INCOMING_FORWARDED_HEADERS=${RIVET_TRUST_INCOMING_FORWARDED_HEADERS:-false}
      - RIVET_UI_TOKEN_FREE_HOSTS=${RIVET_UI_TOKEN_FREE_HOSTS:-}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      executor:
        condition: service_started
    volumes:
      - rivet_data:/data/rivet-app:ro
    restart: unless-stopped

  web:
    image: ${RIVET_WEB_IMAGE:-ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/web:${RIVET_IMAGE_TAG:-latest}}
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.web
      additional_contexts:
        rivet_source: ${RIVET_SOURCE_BUILD_CONTEXT_PATH:-../../rivet}
        rivet_dependency_metadata: ${RIVET_DEPENDENCY_BUILD_CONTEXT_PATH:-../../rivet}
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        all_proxy: ${all_proxy:-${ALL_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
        VITE_RIVET_DEBUG_LOGS: ${VITE_RIVET_DEBUG_LOGS:-false}
        RIVET_PUBLISHED_WORKFLOWS_BASE_PATH: ${RIVET_PUBLISHED_WORKFLOWS_BASE_PATH:-/workflows}
        RIVET_LATEST_WORKFLOWS_BASE_PATH: ${RIVET_LATEST_WORKFLOWS_BASE_PATH:-/workflows-latest}
        RIVET_PUBLISHED_APPS_BASE_PATH: ${RIVET_PUBLISHED_APPS_BASE_PATH:-}
        RIVET_LATEST_APPS_BASE_PATH: ${RIVET_LATEST_APPS_BASE_PATH:-}
        RIVET_WEB_APPS_BASE_PATH: ${RIVET_WEB_APPS_BASE_PATH:-/apps}
        RIVET_LATEST_WEB_APPS_BASE_PATH: ${RIVET_LATEST_WEB_APPS_BASE_PATH:-/apps-latest}
        RIVET_WEB_BUILD_MAX_OLD_SPACE_SIZE: ${RIVET_WEB_BUILD_MAX_OLD_SPACE_SIZE:-4096}
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - all_proxy=${all_proxy:-${ALL_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-}}
      - HOME=/home/rivet
      - npm_config_cache=/home/rivet/.npm
      - YARN_CACHE_FOLDER=/home/rivet/.cache/yarn
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    image: ${RIVET_API_IMAGE:-ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/api:${RIVET_IMAGE_TAG:-latest}}
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.api
      additional_contexts:
        rivet_source: ${RIVET_SOURCE_BUILD_CONTEXT_PATH:-../../rivet}
        rivet_dependency_metadata: ${RIVET_DEPENDENCY_BUILD_CONTEXT_PATH:-../../rivet}
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        all_proxy: ${all_proxy:-${ALL_PROXY:-}}
        no_proxy: ${no_proxy:-${NO_PROXY:-}}
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - all_proxy=${all_proxy:-${ALL_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-}}
      - HOME=/home/rivet
      - npm_config_cache=/home/rivet/.npm
      - PORT=80
      - RIVET_WORKSPACE_ROOT=/workspace
      - RIVET_WORKFLOWS_ROOT=/workflows
      - RIVET_WORKFLOW_RECORDINGS_ROOT=/workflow-recordings
      - RIVET_APP_DATA_ROOT=/data/rivet-app
      - RIVET_RUNTIME_LIBRARIES_ROOT=/data/runtime-libraries
      - RIVET_RUNTIME_PROCESS_ROLE=api
      - RIVET_PUBLISHED_WORKFLOWS_BASE_PATH=${RIVET_PUBLISHED_WORKFLOWS_BASE_PATH:-/workflows}
      - RIVET_LATEST_WORKFLOWS_BASE_PATH=${RIVET_LATEST_WORKFLOWS_BASE_PATH:-/workflows-latest}
      - RIVET_PUBLISHED_APPS_BASE_PATH=${RIVET_PUBLISHED_APPS_BASE_PATH:-}
      - RIVET_LATEST_APPS_BASE_PATH=${RIVET_LATEST_APPS_BASE_PATH:-}
      - RIVET_WEB_APPS_BASE_PATH=${RIVET_WEB_APPS_BASE_PATH:-/apps}
      - RIVET_LATEST_WEB_APPS_BASE_PATH=${RIVET_LATEST_WEB_APPS_BASE_PATH:-/apps-latest}
      - RIVET_RUNTIME_LIBRARIES_SYNC_POLL_INTERVAL_MS
      - RIVET_ENABLE_LATEST_REMOTE_DEBUGGER=${RIVET_ENABLE_LATEST_REMOTE_DEBUGGER:-false}
      - RIVET_KEY=${RIVET_KEY:-}
      - RIVET_CORS_ALLOWED_ORIGINS=${RIVET_CORS_ALLOWED_ORIGINS:-}
      - RIVET_REQUIRE_WORKFLOW_KEY=${RIVET_REQUIRE_WORKFLOW_KEY:-false}
      - RIVET_ENV_ALLOWLIST=${RIVET_ENV_ALLOWLIST:-}
      - RIVET_SHELL_ALLOWLIST=${RIVET_SHELL_ALLOWLIST:-}
      - RIVET_EXTRA_ROOTS=${RIVET_EXTRA_ROOTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_ORG_ID=${OPENAI_ORG_ID:-}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT:-}
    volumes:
      - rivet_workspace:/workspace
      - ${RIVET_WORKFLOWS_HOST_PATH:-../../.data/workflows}:/workflows
      - ${RIVET_WORKFLOW_RECORDINGS_HOST_PATH:-../../.data/workflow-recordings}:/workflow-recordings
      - rivet_data:/data/rivet-app
      - ${RIVET_RUNTIME_LIBS_HOST_PATH:-../../.data/runtime-libraries}:/data/runtime-libraries
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:80/healthz',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  executor:
    image: ${RIVET_EXECUTOR_IMAGE:-ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/executor:${RIVET_IMAGE_TAG:-latest}}
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.executor
      additional_contexts:
        rivet_source: ${RIVET_SOURCE_BUILD_CONTEXT_PATH:-../../rivet}
        rivet_dependency_metadata: ${RIVET_DEPENDENCY_BUILD_CONTEXT_PATH:-../../rivet}
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - all_proxy=${all_proxy:-${ALL_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-}}
      - HOME=/home/rivet
      - npm_config_cache=/home/rivet/.npm
      - YARN_CACHE_FOLDER=/home/rivet/.cache/yarn
      - PORT=21889
      - RIVET_EXECUTOR_PORT=21889
      - RIVET_EXECUTOR_HOST=0.0.0.0
      - RIVET_APP_DATA_ROOT=/home/rivet/.local/share/com.valerypopoff.rivet2
      - RIVET_RUNTIME_LIBRARIES_ROOT=/data/runtime-libraries
      - RIVET_RUNTIME_PROCESS_ROLE=executor
      - RIVET_RUNTIME_LIBRARIES_SYNC_POLL_INTERVAL_MS
      - RIVET_NODE_EXECUTOR_PROXY_SETTINGS_POLL_INTERVAL_MS
    volumes:
      - rivet_data:/home/rivet/.local/share/com.valerypopoff.rivet2
      - ${RIVET_RUNTIME_LIBS_HOST_PATH:-../../.data/runtime-libraries}:/data/runtime-libraries
    restart: unless-stopped

volumes:
  rivet_workspace:
    driver: local
  rivet_data:
    driver: local
  rivet_runtime_libs:
    driver: local
