name: Setup Node and Yarn
description: Set up the repository Node toolchain and restore Yarn install state.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: 22.21.1

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Verify tracked Yarn PnP loaders
      shell: bash
      run: node scripts/checks/check-pnp-install-state.mjs

    - name: Restore Yarn install state
      uses: actions/cache@v4
      with:
        path: .yarn/install-state.gz
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
