name: Publish qualification images

on:
  workflow_dispatch:
    inputs:
      application_build_run_id:
        description: Optional existing successful main application build; reject incompatible runtime changes before building tooling.
        type: string
        default: ''
  workflow_call:
    inputs:
      application_build_run_id:
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: rivet-qualification-image-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  source-contracts:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/studio-server-source-contracts.yml

  publish:
    needs: source-contracts
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned workspace dependencies
        run: corepack yarn install --immutable
      - name: Validate selected application before expensive tooling work
        if: ${{ inputs.application_build_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.application_build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p artifacts/automated-runtime-qualification
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > artifacts/automated-runtime-qualification/build-run.json
          app_source="$(jq -r .head_sha artifacts/automated-runtime-qualification/build-run.json)"
          [[ "$app_source" =~ ^[a-f0-9]{40}$ ]]
          git fetch --depth=1 --filter=blob:none --no-tags origin "$app_source"
          corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-application-reuse
      - name: Use configuration digests for local publication image IDs
        # Docker 29 defaults to containerd IDs (manifest/index digests). This
        # archive/scanner contract uses configuration digests on its fresh host.
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          config = Path('/etc/docker/daemon.json')
          settings = json.loads(config.read_text()) if config.exists() else {}
          settings.setdefault('features', {})['containerd-snapshotter'] = False
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(json.dumps(settings))
          PY
          sudo systemctl restart docker
          docker info
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure cache builder with classic-store output
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: rivet-qualification
          driver: docker-container
      - uses: ./.github/actions/build-cache-runtime
        if: ${{ vars.RIVET_QUALIFICATION_CACHE != 'off' }}
      - name: Build exact source, verify archives, scan and publish immutable images
        env:
          RIVET_QUALIFICATION_BUILDER: rivet-qualification
          RIVET_QUALIFICATION_CACHE: ${{ vars.RIVET_QUALIFICATION_CACHE || 'gha' }}
        run: corepack yarn node scripts/build-and-publish-qualification-images.mjs
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: qualification-image-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification-image-publication/publication.json
            artifacts/qualification-image-publication/actor-scan/linux-amd64/assessment.json
            artifacts/qualification-image-publication/janitor-scan/linux-amd64/assessment.json
          if-no-files-found: error
      - name: Preserve sanitized failed-scan findings
        if: ${{ failure() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: qualification-image-publication-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification-image-publication/*-scan/**/assessment.json
          if-no-files-found: ignore
