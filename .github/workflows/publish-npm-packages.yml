name: Publish npm Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-npm-packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify clean checkout
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Set up build Node
        uses: ./.github/actions/setup-yarn

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache --check-cache

      - name: Verify npm publish package versions
        run: node scripts/publish-npm-packages.mjs --check-versions

      - name: Verify AI graph builder assets
        run: yarn check:graph-builder-assets

      - name: Build publishable packages
        run: node .yarn/releases/yarn-4.17.1.cjs build:npm-public

      - name: Verify package build changed only generated artifacts
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all -- \
            . \
            ':!.yarn/install-state.gz' \
            ':!packages/core/dist/**' \
            ':!packages/node/dist/**' \
            ':!packages/evaluations/dist/**' \
            ':!packages/cli/dist/**' \
            ':!packages/cli/bin/**' \
            ':!packages/cli/tsconfig.tsbuildinfo')"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Set up publish Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.21.1'

      - name: Install publishing-compatible npm
        run: npm install -g npm@11.5.1

      - name: Publish packages
        run: node scripts/publish-npm-packages.mjs --skip-clean-check
        env:
          NPM_CONFIG_PROVENANCE: true
