name: Rollout source contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 5
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '30'
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Keep source and the offline dependency cache, not desktop binaries.
          sparse-checkout: |
            /*
            !/packages/app/sidecars/pnpm/pnpm-aarch64-apple-darwin
            !/packages/app/sidecars/pnpm/pnpm-aarch64-unknown-linux-gnu
            !/packages/app/sidecars/pnpm/pnpm-x86_64-apple-darwin
            !/packages/app/sidecars/pnpm/pnpm-x86_64-pc-windows-msvc.exe
            !/packages/app/sidecars/pnpm/pnpm-x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24.22.1
      - name: Install immutable source-test dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache --mode=skip-build
      - name: Verify rollout source before expensive work
        run: yarn node scripts/ci/verify-rollout-source.mjs
      - name: Install native provider test tools
        timeout-minutes: 2
        env:
          KUBECTL_VERSION: v1.36.6
          HELM_VERSION: v3.22.1
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/rivet-provider-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSL --connect-timeout 10 --max-time 45 "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" -o kubectl
          curl -fsSL --connect-timeout 10 --max-time 15 "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum -c -
          archive="helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSL --connect-timeout 10 --max-time 45 "https://get.helm.sh/$archive" -o "$archive"
          curl -fsSL --connect-timeout 10 --max-time 15 "https://get.helm.sh/$archive.sha256sum" -o helm.sha256
          printf '%s  %s\n' "$(cut -d ' ' -f 1 helm.sha256)" "$archive" | sha256sum -c -
          tar -xzf "$archive" linux-amd64/helm
          mv linux-amd64/helm helm
          chmod +x kubectl helm
          echo "$tools" >> "$GITHUB_PATH"
      - name: Verify packaged provider preparation and cleanup before expensive work
        timeout-minutes: 2
        run: yarn node --test deploy/studio-server/scripts/provider-tool-contracts.test.mjs deploy/studio-server/scripts/reusable-staging.test.mjs deploy/studio-server/scripts/runtime-control-local.test.mjs deploy/studio-server/scripts/ha-gke-availability.test.mjs
