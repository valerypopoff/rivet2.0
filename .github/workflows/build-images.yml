name: Build Images

on:
  push:
    branches:
      - main-rivet2
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  RIVET_REPO_URL: https://github.com/valerypopoff/rivet2.0.git
  RIVET_REPO_REF: main
  IMAGE_NAMESPACE: ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper

jobs:
  verify-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify Repo Structure
        run: npm run verify:repo-structure

      - name: Verify Test Style
        run: npm run verify:test-style

  resolve-rivet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rivet_commit: ${{ steps.resolve.outputs.rivet_commit }}
      rivet_ref: ${{ steps.resolve.outputs.rivet_ref }}
    steps:
      - name: Resolve Upstream Rivet Ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          ref="${RIVET_REPO_REF}"
          if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            commit="$ref"
          else
            refs="$(git ls-remote "$RIVET_REPO_URL" "$ref" "refs/heads/$ref" "refs/tags/$ref" "refs/tags/$ref^{}")"
            commit="$(awk 'NF >= 2 && $2 ~ /\^\{\}$/ { print $1; found=1; exit } NF >= 2 && first == "" { first=$1 } END { if (!found && first != "") print first }' <<< "$refs")"
          fi

          if [ -z "${commit:-}" ]; then
            echo "::error::Could not resolve Rivet ref '$ref' from $RIVET_REPO_URL"
            exit 1
          fi

          echo "rivet_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rivet_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Resolved Rivet ref $ref -> $commit"

  build-and-push:
    needs:
      - resolve-rivet
      - verify-repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RIVET_REPO_REF: ${{ needs.resolve-rivet.outputs.rivet_commit }}
      SOURCE_TAG: build-${{ github.sha }}-${{ needs.resolve-rivet.outputs.rivet_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: proxy
            dockerfile: image/proxy/Dockerfile
            image: ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/proxy
            platforms: linux/amd64,linux/arm64
            needsRivet: false
            rivetSourceContext: .
            rivetDependencyContext: .
          - service: web
            dockerfile: image/web/Dockerfile
            image: ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/web
            platforms: linux/amd64,linux/arm64
            needsRivet: true
            rivetSourceContext: .data/docker-contexts/rivet-source
            rivetDependencyContext: .data/docker-contexts/rivet-dependency-metadata
          - service: api
            dockerfile: image/api/Dockerfile
            image: ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/api
            platforms: linux/amd64
            needsRivet: true
            rivetSourceContext: .data/docker-contexts/rivet-source
            rivetDependencyContext: .data/docker-contexts/rivet-dependency-metadata
          - service: executor
            dockerfile: image/executor/Dockerfile
            image: ghcr.io/valerypopoff/cloud-hosted-rivet2-wrapper/executor
            platforms: linux/amd64
            needsRivet: true
            rivetSourceContext: .data/docker-contexts/rivet-source
            rivetDependencyContext: .data/docker-contexts/rivet-dependency-metadata

    steps:
      - name: Check Out Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set Up Node
        if: ${{ matrix.needsRivet }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Bootstrap Upstream Rivet
        if: ${{ matrix.needsRivet }}
        run: |
          if [ ! -d rivet ] || [ -z "$(ls -A rivet 2>/dev/null)" ]; then
            npm run setup:rivet
          fi

      - name: Prepare Rivet Docker Contexts
        if: ${{ matrix.needsRivet }}
        run: npm run dev:docker:prepare-rivet-context

      - name: Set Up QEMU
        if: ${{ contains(matrix.platforms, 'linux/arm64') }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log In to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.SOURCE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.rivet.source=${{ env.RIVET_REPO_URL }}
            org.opencontainers.image.rivet.ref=${{ needs.resolve-rivet.outputs.rivet_ref }}
            org.opencontainers.image.rivet.revision=${{ needs.resolve-rivet.outputs.rivet_commit }}

      - name: Build and Push ${{ matrix.service }}
        id: build
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            rivet_source=${{ matrix.rivetSourceContext }}
            rivet_dependency_metadata=${{ matrix.rivetDependencyContext }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Refresh GHCR Login Before Retry
        if: ${{ steps.build.outcome == 'failure' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry Build and Push ${{ matrix.service }}
        if: ${{ steps.build.outcome == 'failure' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            rivet_source=${{ matrix.rivetSourceContext }}
            rivet_dependency_metadata=${{ matrix.rivetDependencyContext }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote-images:
    needs:
      - resolve-rivet
      - build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_TAG: build-${{ github.sha }}-${{ needs.resolve-rivet.outputs.rivet_commit }}
    steps:
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log In to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Metadata
        id: release-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/proxy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-rivet2' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Promote Complete Image Set
        shell: bash
        env:
          PROXY_RELEASE_TAGS: ${{ steps.release-meta.outputs.tags }}
        run: |
          set -euo pipefail

          tag_suffixes=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            prefix="${IMAGE_NAMESPACE}/proxy:"
            if [[ "$tag" != "$prefix"* ]]; then
              echo "::error::Unexpected release tag from metadata action: $tag"
              exit 1
            fi
            tag_suffixes+=("${tag#"$prefix"}")
          done <<< "$PROXY_RELEASE_TAGS"

          if [ "${#tag_suffixes[@]}" -eq 0 ]; then
            echo "::error::No release image tags were generated"
            exit 1
          fi

          for service in proxy web api executor; do
            source_image="${IMAGE_NAMESPACE}/${service}:${SOURCE_TAG}"
            destination_args=()
            for suffix in "${tag_suffixes[@]}"; do
              destination_args+=(--tag "${IMAGE_NAMESPACE}/${service}:${suffix}")
            done

            for attempt in 1 2 3; do
              if docker buildx imagetools create "${destination_args[@]}" "$source_image"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to promote $service after $attempt attempts"
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done
