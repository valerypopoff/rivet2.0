name: Release Rivet

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main Build Images run for a new staging qualification. Leave empty when reusing a qualified publication.
        default: ''
        type: string
      tooling_run_id:
        description: Optional successful main Publish qualification images run. Reuses the application build only when runtime inputs are unchanged.
        type: string
        default: ''
      deploy_production:
        description: Deploy after qualification and publication using the protected production environment.
        type: boolean
        default: true
      sizing_requests:
        description: 'Optional sizing-only web/proxy CPU and memory request JSON. Requires deploy_production=false; no qualification publication. Values must be compatible with GKE placement.'
        type: string
        default: ''
      qualified_publication_run_id:
        description: 'Production only: successful qualified publication run to deploy, without staging or rebuilding. Leave build/tooling/sizing inputs empty.'
        type: string
        default: ''
      recovered_operation_uri:
        description: Optional generation-pinned private qualification receipt, only when cleanup recovery did not retain the normal staging artifact.
        type: string
        default: ''
      recovered_operation_sha256:
        description: SHA256 of the recovered receipt (sha256:...). Required only with recovered_operation_uri.
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  packages: write

# One approved provider operation at a time; never cancel its cleanup for a push.
concurrency:
  group: rivet-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  built:
    name: Built — validate immutable inputs
    if: ${{ inputs.qualified_publication_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      run_attempt: ${{ steps.build.outputs.run_attempt }}
      tooling_run_id: ${{ steps.build.outputs.tooling_run_id }}
      tooling_run_attempt: ${{ steps.build.outputs.tooling_run_attempt }}
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      TOOLING_RUN_ID: ${{ inputs.tooling_run_id }}
      RIVET_QUALIFICATION_SIZING_REQUESTS: ${{ inputs.sizing_requests }}
      RIVET_QUALIFICATION_DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
      RIVET_AUTOMATED_QUALIFICATION_ENABLED: ${{ vars.RIVET_AUTOMATED_QUALIFICATION_ENABLED }}
      PACKET: artifacts/automated-runtime-qualification
    steps:
      - name: Require main without a successful skipped qualification
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Reject recovery inputs outside production-only mode
        env:
          RECOVERED_OPERATION_URI: ${{ inputs.recovered_operation_uri }}
          RECOVERED_OPERATION_SHA256: ${{ inputs.recovered_operation_sha256 }}
        run: test -z "$RECOVERED_OPERATION_URI" && test -z "$RECOVERED_OPERATION_SHA256"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned workspace dependencies
        run: corepack yarn install --immutable
      - name: Refuse disabled automation or invalid run identifiers
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-run-id
      - name: Verify exact successful main image build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$PACKET/build-run.json"
          if [[ -n "$TOOLING_RUN_ID" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TOOLING_RUN_ID" > "$PACKET/tooling-run.json"
            app_source="$(jq -r .head_sha "$PACKET/build-run.json")"
            [[ "$app_source" =~ ^[a-f0-9]{40}$ ]]
            git fetch --depth=1 --filter=blob:none --no-tags origin "$app_source"
          fi
          corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-server-candidate-release-manifest-${{ inputs.build_run_id }}-${{ steps.build.outputs.run_attempt }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/automated-runtime-qualification/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-server-release-manifest-${{ inputs.build_run_id }}-${{ steps.build.outputs.run_attempt }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/automated-runtime-qualification/original
      - name: Validate original artifacts before any provider access
        id: candidate
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-candidate
      - name: Download selected tooling publication before provider access
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-image-publication-${{ steps.build.outputs.tooling_run_id }}-${{ steps.build.outputs.tooling_run_attempt }}
          run-id: ${{ steps.build.outputs.tooling_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/qualification-image-publication
      - name: Verify application and tooling binding
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-tooling
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact immutable predecessor, not the publication pointer
        env:
          PREDECESSOR_REFERENCE: ${{ steps.candidate.outputs.predecessor_reference }}
        run: corepack yarn node deploy/studio-server/scripts/release-manifest-oci.mjs pull --reference "$PREDECESSOR_REFERENCE" --output "$PACKET/predecessor.json"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: qualification-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/automated-runtime-qualification
          if-no-files-found: error

  qualified:
    name: Staging — observe candidate and verify cleanup
    if: ${{ inputs.qualified_publication_run_id == '' }}
    needs: built
    runs-on: ubuntu-latest
    environment: rivet-managed-staging
    # Focused continuity is the default, including first adoption. Separately
    # configured stress/overlap tests may use 4h, plus 1h cleanup and 30m setup.
    # The separately approved operation deadline still limits actual test work.
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    outputs:
      control: ${{ steps.execute.outputs.control }}
      autoscaling: ${{ steps.execute.outputs.autoscaling }}
    env:
      RIVET_QUALIFICATION_ENVIRONMENT_MODE: reusable-cluster
      TOOLING_RUN_ID: ${{ inputs.tooling_run_id }}
      RIVET_QUALIFICATION_COORDINATOR_MODE: external
      RIVET_QUALIFICATION_SIZING_REQUESTS: ${{ inputs.sizing_requests }}
      RIVET_QUALIFICATION_DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
      RIVET_AUTOMATED_QUALIFICATION_ENABLED: ${{ vars.RIVET_AUTOMATED_QUALIFICATION_ENABLED }}
      RIVET_QUALIFICATION_MAX_USD: ${{ vars.RIVET_QUALIFICATION_MAX_USD }}
      RIVET_QUALIFICATION_MAX_SECONDS: ${{ vars.RIVET_QUALIFICATION_MAX_SECONDS }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack yarn install --immutable
      - name: Select pinned release Helm
        timeout-minutes: 2
        run: corepack yarn studio-server:setup:k8s-tools --github-env

      - name: Validate approved test window before cloud access
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-window
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/automated-runtime-qualification
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-image-publication-${{ needs.built.outputs.tooling_run_id }}-${{ needs.built.outputs.tooling_run_attempt }}
          run-id: ${{ needs.built.outputs.tooling_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/qualification-image-publication
      - name: Recheck selected tooling before cloud credentials
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs validate-tooling
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RIVET_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RIVET_GOOGLE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - name: Prepare private cloud job configuration
        id: prepare
        env:
          RIVET_DEPLOYMENT_CONFIGURATION: ${{ secrets.RIVET_DEPLOYMENT_CONFIGURATION }}
        run: corepack yarn node deploy/studio-server/scripts/prepare-hosted-release.mjs staging
      - name: Observe installed predecessor with read-only credentials
        id: inspect
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs inspect
      - name: Run approved provider operation and compile evidence after cleanup
        id: execute
        run: corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs execute
      - name: Close failed pre-operation staging setup
        if: ${{ always() && steps.execute.outcome == 'skipped' && (steps.prepare.outcome == 'failure' || steps.inspect.outcome == 'failure') }}
        timeout-minutes: 10
        run: corepack yarn node deploy/studio-server/scripts/prepare-hosted-release.mjs cleanup-staging-setup
      - name: Retain sanitized successful staging packet
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: qualification-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/automated-runtime-qualification/qualification-result.json
            artifacts/automated-runtime-qualification/operation-public.json
          if-no-files-found: error

  publish:
    name: Publish qualified exact release
    if: ${{ inputs.qualified_publication_run_id == '' && inputs.sizing_requests == '' }}
    needs: qualified
    uses: ./.github/workflows/studio-server-runtime-qualification.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
      tooling_run_id: ${{ inputs.tooling_run_id }}
      runtime_control_declaration: ${{ needs.qualified.outputs.control }}
      runtime_autoscaling_declaration: ${{ needs.qualified.outputs.autoscaling }}

  deploy:
    name: Deploy — live checks, rolling update and acceptance
    if: ${{ !cancelled() && ((inputs.qualified_publication_run_id != '' && needs.qualified.result == 'skipped' && needs.publish.result == 'skipped') || (inputs.qualified_publication_run_id == '' && inputs.deploy_production && inputs.sizing_requests == '' && needs.qualified.result == 'success' && needs.publish.result == 'success')) }}
    needs: [qualified, publish]
    runs-on: ubuntu-latest
    environment: rivet-production
    # Includes the protected first transition; no separate readiness job.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    env:
      QUALIFIED_MANIFEST_DIGEST: ${{ needs.publish.outputs.manifest_digest }}
      QUALIFIED_PUBLICATION_RUN_ID: ${{ inputs.qualified_publication_run_id }}
      RECOVERED_OPERATION_URI: ${{ inputs.recovered_operation_uri }}
      RECOVERED_OPERATION_SHA256: ${{ inputs.recovered_operation_sha256 }}
    defaults:
      run:
        working-directory: ${{ inputs.qualified_publication_run_id != '' && 'qualified' || '.' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack yarn install --immutable
        working-directory: .
      - name: Resolve an existing qualified publication before cloud access
        if: ${{ inputs.qualified_publication_run_id != '' }}
        id: reuse
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          REUSE_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REUSE_TOOLING_RUN_ID: ${{ inputs.tooling_run_id }}
          REUSE_SIZING_REQUESTS: ${{ inputs.sizing_requests }}
        run: corepack yarn node deploy/studio-server/scripts/prepare-qualified-deployment.mjs resolve
      - name: Check out the exact qualified deployment source
        if: ${{ inputs.qualified_publication_run_id != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.reuse.outputs.source_sha }}
          path: qualified
          persist-credentials: false
      - name: Install the qualified source dependencies
        if: ${{ inputs.qualified_publication_run_id != '' }}
        run: corepack yarn install --immutable
      - name: Select pinned release Helm
        timeout-minutes: 2
        run: corepack yarn studio-server:setup:k8s-tools --github-env

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RIVET_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RIVET_GOOGLE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - name: Prepare private cloud job configuration
        env:
          RIVET_DEPLOYMENT_CONFIGURATION: ${{ secrets.RIVET_DEPLOYMENT_CONFIGURATION }}
        run: corepack yarn node deploy/studio-server/scripts/prepare-hosted-release.mjs production
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.qualified_publication_run_id == '' }}
        with:
          name: qualification-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/automated-runtime-qualification
      - name: Prepare the original qualification receipt
        if: ${{ inputs.qualified_publication_run_id != '' }}
        working-directory: .
        env:
          DEPLOYMENT_SOURCE_SHA: ${{ steps.reuse.outputs.source_sha }}
          QUALIFIED_MANIFEST_DIGEST: ${{ steps.reuse.outputs.manifest_digest }}
        run: corepack yarn node deploy/studio-server/scripts/prepare-qualified-deployment.mjs materialize
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the qualified immutable manifest
        env:
          RELEASE_MANIFEST_REPOSITORY: ghcr.io/${{ github.repository }}-studio-server/release-manifest
          DEPLOYMENT_SOURCE_SHA: ${{ steps.reuse.outputs.source_sha || github.sha }}
          QUALIFIED_MANIFEST_DIGEST: ${{ steps.reuse.outputs.manifest_digest || needs.publish.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          if [[ -z "$QUALIFIED_PUBLICATION_RUN_ID" ]]; then
            reference="$RELEASE_MANIFEST_REPOSITORY:manifest-${QUALIFIED_MANIFEST_DIGEST#sha256:}"
            corepack yarn node deploy/studio-server/scripts/release-manifest-oci.mjs pull --reference "$reference" --output artifacts/automated-runtime-qualification/qualified-manifest.json
          fi
          if [[ -n "$QUALIFIED_PUBLICATION_RUN_ID" ]]; then
            corepack yarn node "$GITHUB_WORKSPACE/deploy/studio-server/scripts/deploy-qualified-production.mjs"
          else
            corepack yarn node deploy/studio-server/scripts/execute-runtime-qualification.mjs deploy
          fi
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: deployment-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.qualified_publication_run_id != '' && 'qualified/' || '' }}artifacts/automated-runtime-qualification/deployment-summary.json
          if-no-files-found: error
