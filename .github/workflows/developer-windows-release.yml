name: Developer Desktop Release

on:
  push:
    branches:
      - develop
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/developer-windows-release.yml'
      - '.pnp.cjs'
      - '.pnp.loader.mjs'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'package.json'
      - 'packages/app/**'
      - 'packages/app-executor/**'
      - 'packages/core/**'
      - 'packages/docs/**'
      - 'packages/evaluations/**'
      - 'packages/node/**'
      - 'scripts/build-wrapper-target.mjs'
      - 'scripts/checks/check-graph-builder*'
      - 'scripts/sync-desktop-version.mjs'
      - 'yarn.lock'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: developer-desktop-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  release:
    uses: ./.github/workflows/desktop-release.yml
    with:
      branch_ref: refs/heads/develop
      channel: developer
      channel_label: Developer
      environment_name: developer-windows-pages
      preserve_metadata_file: official-release.json
    secrets: inherit
