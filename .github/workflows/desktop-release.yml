name: Reusable Desktop Release

on:
  workflow_call:
    inputs:
      branch_ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      channel_label:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      preserve_metadata_file:
        required: true
        type: string

jobs:
  verify-ai-graph-builder-assets:
    name: Verify AI Graph Builder assets
    if: github.ref == inputs.branch_ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Verify AI graph builder assets
        run: yarn check:graph-builder-assets

  build-windows:
    name: ${{ inputs.channel_label }} Windows desktop bundle
    if: github.ref == inputs.branch_ref
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/setup-pkg-cache
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Sync desktop version metadata
        run: yarn sync:desktop-version
      - name: Build desktop web dependencies
        run: yarn build:hosted-web-deps
        env:
          NODE_OPTIONS: --max-old-space-size=6000
      - name: Build Tauri Windows bundle
        working-directory: packages/app
        run: yarn tauri build --verbose --ci --bundles "msi,nsis"
        env:
          NODE_OPTIONS: --max-old-space-size=6000
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: rivet-${{ inputs.channel }}-windows-bundles
          path: packages/app/src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: ${{ inputs.channel_label }} macOS desktop bundle
    if: github.ref == inputs.branch_ref
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/setup-pkg-cache
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Sync desktop version metadata
        run: yarn sync:desktop-version
      - name: Build desktop web dependencies
        run: yarn build:hosted-web-deps
        env:
          NODE_OPTIONS: --max-old-space-size=6000
      - name: Prepare Apple signing and notarization
        run: bash .github/scripts/prepare-macos-signing-env.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Build Tauri macOS bundle
        working-directory: packages/app
        run: yarn tauri build --verbose --ci --target universal-apple-darwin --bundles "dmg"
        env:
          NODE_OPTIONS: --max-old-space-size=6000
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      - name: Notarize macOS DMG
        run: bash .github/scripts/notarize-macos-dmg.sh
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      - name: Verify macOS signing and notarization
        run: bash .github/scripts/verify-macos-dmg.sh
      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: rivet-${{ inputs.channel }}-macos-bundles
          path: packages/app/src-tauri/target/universal-apple-darwin/release/bundle
          if-no-files-found: error
          retention-days: 7

  build-docs:
    name: ${{ inputs.channel_label }} documentation site
    if: github.ref == inputs.branch_ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Build documentation site
        run: node .yarn/releases/yarn-4.17.1.cjs workspace docs run build
        env:
          NODE_OPTIONS: --max-old-space-size=6000
      - name: Upload documentation site
        uses: actions/upload-artifact@v7
        with:
          name: rivet-${{ inputs.channel }}-docs-site
          path: packages/docs/build
          if-no-files-found: error
          retention-days: 7

  publish-pages:
    name: Publish ${{ inputs.channel }} desktop downloads
    if: github.ref == inputs.branch_ref
    needs:
      - verify-ai-graph-builder-assets
      - build-windows
      - build-macos
      - build-docs
    runs-on: ubuntu-latest
    concurrency:
      group: rivet-docs-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.deployment_first_attempt.outputs.page_url || steps.deployment.outputs.page_url }}
    env:
      PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.1'
      - name: Confirm release is still current
        id: freshness
        shell: bash
        run: |
          current_sha="$(git ls-remote origin "${{ inputs.branch_ref }}" | awk '{print $1}')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Current branch head is $current_sha; skipping stale release $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync desktop version metadata
        if: steps.freshness.outputs.current == 'true'
        run: node scripts/sync-desktop-version.mjs
      - name: Download documentation site
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v7
        with:
          name: rivet-${{ inputs.channel }}-docs-site
          path: packages/docs/build
      - name: Download Windows bundles
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v7
        with:
          name: rivet-${{ inputs.channel }}-windows-bundles
          path: release-bundles/windows
      - name: Download macOS bundles
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v7
        with:
          name: rivet-${{ inputs.channel }}-macos-bundles
          path: release-bundles/macos
      - name: Confirm release is still current before publishing assets
        id: asset_freshness
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          current_sha="$(git ls-remote origin "${{ inputs.branch_ref }}" | awk '{print $1}')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Current branch head is $current_sha; skipping stale release $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish desktop release assets
        if: steps.asset_freshness.outputs.current == 'true'
        run: node .github/scripts/publish-desktop-release-assets.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_PLATFORMS: windows,macos
          RELEASE_TARGET_COMMITISH: ${{ github.event.repository.default_branch }}
          RELEASE_ASSETS_MANIFEST_PATH: release-assets-manifest.json
          WINDOWS_BUNDLE_DIR: release-bundles/windows
          MACOS_BUNDLE_DIR: release-bundles/macos
      - name: Add release downloads to docs site
        if: steps.asset_freshness.outputs.current == 'true'
        run: node .github/scripts/prepare-desktop-release-pages.mjs
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_LABEL: ${{ inputs.channel }}-${{ github.run_number }}-${{ github.sha }}
          RELEASE_PLATFORMS: windows,macos
          PRESERVE_RELEASE_METADATA_FILES: ${{ inputs.preserve_metadata_file }}
          PAGES_SITE_URL: https://valerypopoff.github.io/rivet2.0/
          PAGES_OUT_DIR: packages/docs/build
          RELEASE_ASSETS_MANIFEST_PATH: release-assets-manifest.json
      - name: Confirm release is still current before publishing Pages
        id: pages_freshness
        if: steps.asset_freshness.outputs.current == 'true'
        shell: bash
        run: |
          current_sha="$(git ls-remote origin "${{ inputs.branch_ref }}" | awk '{print $1}')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "Current branch head is $current_sha; skipping stale release $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.pages_freshness.outputs.current == 'true' && env.PAGES_ENABLEMENT_TOKEN == ''
        uses: actions/configure-pages@v6
      - name: Configure Pages and enable site
        if: steps.pages_freshness.outputs.current == 'true' && env.PAGES_ENABLEMENT_TOKEN != ''
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ env.PAGES_ENABLEMENT_TOKEN }}
      - name: Upload Pages artifact
        if: steps.pages_freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/build
      - name: Deploy to GitHub Pages (attempt 1 of 2)
        if: steps.pages_freshness.outputs.current == 'true'
        id: deployment_first_attempt
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: '300000'
      - name: Wait for GitHub Pages cancellation to settle
        if: steps.pages_freshness.outputs.current == 'true' && steps.deployment_first_attempt.outcome == 'failure'
        run: sleep 15
      - name: Deploy to GitHub Pages (attempt 2 of 2)
        if: steps.pages_freshness.outputs.current == 'true' && steps.deployment_first_attempt.outcome == 'failure'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: '300000'
