name: Release

on:
  push:
    branches:
      - windows-builds
    tags:
      - app-v*
jobs:
  verify-ai-graph-builder-assets:
    name: Verify AI Graph Builder assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Verify AI graph builder assets
        run: yarn check:graph-builder-assets

  build-release:
    needs: verify-ai-graph-builder-assets
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
          - runner: macos-15
            desktop_target: aarch64-apple-darwin
            macos_architecture: aarch64
          - runner: macos-15-intel
            desktop_target: x86_64-apple-darwin
            macos_architecture: x86_64
          - runner: ubuntu-22.04
          - runner: ubuntu-22.04-arm
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/setup-pkg-cache
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.desktop_target }}
        if: matrix.desktop_target != ''
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.desktop_target == ''

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          key: ${{ matrix.desktop_target || matrix.runner }}

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Build desktop web dependencies
        run: yarn build:hosted-web-deps
        env:
          NODE_OPTIONS: --max-old-space-size=6000
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/app
          tauriScript: yarn tauri
          tagName: app-v__VERSION__
          releaseName: 'Rivet 2 v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          # v0 of tauri-action calls this input includeUpdaterJson. A separate,
          # post-matrix job writes latest.json once all native artifacts exist.
          includeUpdaterJson: false
          args: ${{ matrix.desktop_target != '' && format('--verbose --target {0}', matrix.desktop_target) || '--verbose' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: --max-old-space-size=6000
          RIVET_DESKTOP_TARGET: ${{ matrix.desktop_target }}
      - name: Verify packaged macOS sidecars
        if: matrix.desktop_target != ''
        shell: bash
        run: |
          app_path="$(find "packages/app/src-tauri/target/${{ matrix.desktop_target }}/release/bundle" -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          node .github/scripts/verify-macos-sidecars.mjs "$app_path" "${{ matrix.desktop_target }}"

  publish-updater-manifest:
    name: Publish architecture-specific updater manifest
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.1'
      - name: Publish updater manifest after all architecture bundles upload
        run: node .github/scripts/publish-tauri-updater-manifest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
