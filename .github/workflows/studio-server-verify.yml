name: Verify Studio Server

on:
  push:
    branches:
      - develop
      - codex/import-studio-server
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-studio-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check Out Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set Up Kubernetes Tools
        run: |
          corepack enable
          yarn install --immutable
          yarn studio-server:setup:k8s-tools

      - name: Run Repository Verification
        run: yarn studio-server:test
