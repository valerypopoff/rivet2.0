name: Verify Studio Server

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - staging
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        description: Run every Studio Server verification job regardless of changed paths.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-studio-server-${{ github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify Studio Server changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.studio_server }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/ci/ci-change-policy.mjs
          sparse-checkout-cone-mode: false
      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Classify changed paths
        id: classify
        env:
          RIVET_CI_FORCE: ${{ inputs.force == true }}
        run: node scripts/ci/ci-change-policy.mjs

  build-studio-server:
    name: Build Studio Server
    if: needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "Build Studio Server"
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Build Studio Server
        run: yarn studio-server:build
      - name: Verify compiled workspace dependencies
        run: yarn check:compiled-workspace-exports
      - name: Upload compiled Studio Server dependencies
        uses: actions/upload-artifact@v7
        with:
          name: studio-server-build-${{ github.sha }}
          path: |
            packages/core/dist
            packages/node/dist
            packages/evaluations/dist
            packages/app-executor/bin/executor-bundle.cjs
            packages/studio-server-shared/dist
            packages/studio-server-bootstrap/dist
            packages/studio-server-api/dist
            packages/studio-server-executor/dist
            packages/studio-server-web/dist
          if-no-files-found: error
          retention-days: 1
          # Keep the name stable for isolated consumer-job re-runs, while
          # allowing this single producer to replace an earlier attempt.
          overwrite: true
      - name: Report timing
        if: always()
        run: node scripts/ci/job-timing.mjs finish "Build Studio Server"

  api-tests:
    name: API tests ${{ matrix.label }}/4
    if: needs.changes.outputs.relevant == 'true'
    needs:
      - changes
      - build-studio-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: 0
            label: 1
          - shard: 1
            label: 2
          - shard: 2
            label: 3
          - shard: 3
            label: 4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "API tests ${{ matrix.label }}/4"
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Download compiled Studio Server dependencies
        uses: actions/download-artifact@v7
        with:
          name: studio-server-build-${{ github.sha }}
          # upload-artifact stores these selected paths relative to their shared
          # packages/ ancestor. Restore below packages/ so workspace exports
          # remain at packages/<name>/dist.
          path: packages
      - name: Verify restored compiled workspace dependencies
        run: yarn check:compiled-workspace-exports
      - name: Run API test shard
        run: node deploy/studio-server/scripts/run-api-tests.mjs --shard-index ${{ matrix.shard }} --shard-count 4
        env:
          # Rehearsal subprocesses consume this verified same-commit tsc build,
          # avoiding hundreds of repeated source transformations across restarts.
          RIVET_API_TEST_RUNTIME: prebuilt
      - name: Report timing
        if: always()
        run: node scripts/ci/job-timing.mjs finish "API tests ${{ matrix.label }}/4"

  web-tests:
    name: Studio Server web tests
    if: needs.changes.outputs.relevant == 'true'
    needs:
      - changes
      - build-studio-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "Studio Server web tests"
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Download compiled Studio Server dependencies
        uses: actions/download-artifact@v7
        with:
          name: studio-server-build-${{ github.sha }}
          # See the API shard restore above: preserve package-defined export paths.
          path: packages
      - name: Verify restored compiled workspace dependencies
        run: yarn check:compiled-workspace-exports
      - name: Run pure web tests
        run: yarn studio-server:verify:web-pure
      - name: Verify hosted executor Subgraph loader
        run: yarn workspace @valerypopoff/rivet-studio-server-executor run test:runtime
      - name: Report timing
        if: always()
        run: node scripts/ci/job-timing.mjs finish "Studio Server web tests"

  editor-regression:
    name: Studio Server editor regressions (${{ matrix.shard }})
    if: needs.changes.outputs.relevant == 'true'
    needs:
      - changes
      - build-studio-server
    runs-on: ubuntu-latest
    # Only Chromium runs in the prepared image. Node tests retain host Docker
    # access for real PostgreSQL/MinIO fixtures and their loopback endpoints.
    env:
      RIVET_CI_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      RIVET_CI_PLAYWRIGHT_VERSION: '1.62.1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3100/
      PW_TEST_CONNECT_EXPOSE_NETWORK: '<loopback>'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 1/3
            label: 1
          - shard: 2/3
            label: 2
          - shard: 3/3
            label: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "Studio Server editor regressions (${{ matrix.shard }})"
      - name: Install dependencies
        timeout-minutes: 3
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Download compiled Studio Server dependencies
        uses: actions/download-artifact@v7
        with:
          name: studio-server-build-${{ github.sha }}
          path: packages
      - name: Verify restored compiled workspace dependencies
        run: yarn check:compiled-workspace-exports
      # The executor subprocess consumes compiled Core/Node exports restored above.
      # Keep this runtime regression out of the source-only repository-contract job.
      - name: Verify accepted executor retirement
        if: matrix.label == 1
        run: yarn studio-server:verify:executor-retirement
      - name: Prepare browser runtime
        id: browser-runtime
        timeout-minutes: 4
        shell: bash
        run: |
          docker pull "$RIVET_CI_BROWSER_IMAGE"
          container_id=$(docker create --init --ipc=host --publish 127.0.0.1:3100:3100 \
            --label "rivet.ci.browser=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.label }}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace --env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            "$RIVET_CI_BROWSER_IMAGE" node .yarn/releases/yarn-4.17.1.cjs \
            workspace @valerypopoff/rivet-studio-server-web exec playwright run-server \
            --host 0.0.0.0 --port 3100)
          [[ "$container_id" =~ ^[a-f0-9]{64}$ ]]
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          docker start "$container_id"
          ready=false
          for attempt in {1..30}; do
            if docker logs "$container_id" 2>&1 | grep -Fq 'Listening on ws://0.0.0.0:3100/'; then
              ready=true
              break
            fi
            test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = true
            sleep 1
          done
          docker logs "$container_id"
          test "$ready" = true
          yarn node scripts/ci/verify-browser-environment.mjs
      - name: Report browser setup timing
        if: ${{ !cancelled() && env.RIVET_CI_JOB_STARTED_AT != '' }}
        run: node scripts/ci/job-timing.mjs finish "Browser setup (${{ matrix.shard }})"
      - name: Run hosted editor regressions
        timeout-minutes: 12
        env:
          PLAYWRIGHT_HEADLESS: 1
          PLAYWRIGHT_SLOW_MO: 0
          RIVET_EDITOR_TEST_SHARD: ${{ matrix.shard }}
        run: yarn studio-server:ui:ci
      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-server-editor-regression-${{ github.sha }}-${{ matrix.label }}
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop owned browser runtime
        if: ${{ always() && steps.browser-runtime.outputs.container_id != '' }}
        env:
          CONTAINER_ID: ${{ steps.browser-runtime.outputs.container_id }}
          EXPECTED_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
        shell: bash
        run: |
          [[ "$CONTAINER_ID" =~ ^[a-f0-9]{64}$ ]]
          test "$(docker inspect --format '{{ index .Config.Labels "rivet.ci.browser" }}' "$CONTAINER_ID")" = "$EXPECTED_OWNER"
          docker rm -f "$CONTAINER_ID"
      - name: Report timing
        if: always()
        run: node scripts/ci/job-timing.mjs finish "Studio Server editor regressions (${{ matrix.shard }})"

  host-compatibility:
    name: Studio Server host compatibility
    if: needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "Studio Server host compatibility"
      - name: Verify hosted compatibility
        run: node .yarn/releases/yarn-4.17.1.cjs studio-server:verify:host-compatibility
      - name: Report timing
        if: always()
        run: node scripts/ci/job-timing.mjs finish "Studio Server host compatibility"

  repository-contracts:
    name: Studio Server repository contracts
    if: needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        timeout-minutes: 5
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        env:
          # Fail a stalled read early enough for checkout's bounded fetch retries.
          GIT_HTTP_LOW_SPEED_LIMIT: '1024'
          GIT_HTTP_LOW_SPEED_TIME: '30'
        with:
          fetch-depth: 1
          fetch-tags: false
          # Retain all authored files and the offline Yarn cache. This lane never
          # packages desktop binaries; do not download 265 MiB of unused sidecars.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packages/app/sidecars/pnpm/pnpm-aarch64-apple-darwin
            !/packages/app/sidecars/pnpm/pnpm-aarch64-unknown-linux-gnu
            !/packages/app/sidecars/pnpm/pnpm-x86_64-apple-darwin
            !/packages/app/sidecars/pnpm/pnpm-x86_64-pc-windows-msvc.exe
            !/packages/app/sidecars/pnpm/pnpm-x86_64-unknown-linux-gnu
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "Studio Server repository contracts"
      - name: Prepare migration Git evidence
        timeout-minutes: 4
        run: node scripts/ci/prepare-migration-history.mjs
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Verify migration ledger
        run: yarn studio-server:verify:migration-ledger
      - name: Verify production cutover
        run: yarn studio-server:verify:production-cutover
      - name: Verify test style
        run: yarn studio-server:verify:test-style
      - name: Verify repository structure
        run: yarn studio-server:verify:repo-structure
      - name: Report timing
        if: ${{ !cancelled() && env.RIVET_CI_JOB_STARTED_AT != '' }}
        run: node scripts/ci/job-timing.mjs finish "Studio Server repository contracts"

  deployment-contracts:
    name: Studio Server deployment contracts (${{ matrix.lane }})
    if: needs.changes.outputs.relevant == 'true'
    needs:
      - changes
      - build-studio-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [managed, deployment, gateway]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-yarn
        with:
          node-version: 24
      - name: Start timing
        run: node scripts/ci/job-timing.mjs start "Studio Server deployment contracts (${{ matrix.lane }})"
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Download compiled Studio Server dependencies
        uses: actions/download-artifact@v7
        with:
          name: studio-server-build-${{ github.sha }}
          # See the API shard restore above: preserve package-defined export paths.
          path: packages
      - name: Verify restored compiled workspace dependencies
        run: yarn check:compiled-workspace-exports
      - name: Set Up Kubernetes Tools
        if: matrix.lane == 'deployment'
        run: yarn studio-server:setup:k8s-tools
      - name: Verify compiled migrations on PostgreSQL
        if: matrix.lane == 'managed'
        run: yarn node deploy/studio-server/scripts/verify-managed-workflow-schema.mjs
      - name: Verify async endpoint completion with managed storage
        if: matrix.lane == 'managed'
        run: yarn workspace @valerypopoff/rivet-studio-server-api run test:async-managed
      - name: Verify managed scheduler claims and safe schedule import
        if: matrix.lane == 'managed'
        run: yarn workspace @valerypopoff/rivet-studio-server-api run test:scheduled-managed
      - name: Verify PostgreSQL recording families, presence and query bounds
        if: matrix.lane == 'managed'
        run: yarn workspace @valerypopoff/rivet-studio-server-api run test:statistics-managed
      - name: Verify VM-to-managed copy, retry, and exact readback
        if: matrix.lane == 'managed'
        run: yarn workspace @valerypopoff/rivet-studio-server-api run test:migration-managed
      - name: Verify Kubernetes and deployment contracts
        if: matrix.lane == 'deployment'
        run: yarn studio-server:verify:kubernetes
      - name: Verify proxy DNS outages, browser continuity and address recovery
        if: matrix.lane == 'gateway'
        run: node deploy/studio-server/scripts/verify-proxy-dns.mjs
      - name: Upload proxy DNS browser diagnostics
        if: always() && matrix.lane == 'gateway'
        uses: actions/upload-artifact@v7
        with:
          name: proxy-dns-browser-${{ github.sha }}
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify single-VM nginx TLS gateway
        if: matrix.lane == 'gateway'
        run: node deploy/studio-server/scripts/verify-vm-nginx-tls.mjs
      - name: Verify trusted-client proxy templates and executor upgrades
        if: matrix.lane == 'gateway'
        run: node deploy/studio-server/scripts/verify-trusted-client-proxy.mjs
      - name: Report timing
        if: always()
        run: node scripts/ci/job-timing.mjs finish "Studio Server deployment contracts (${{ matrix.lane }})"

  verify:
    if: always()
    needs:
      - changes
      - build-studio-server
      - api-tests
      - web-tests
      - editor-regression
      - host-compatibility
      - repository-contracts
      - deployment-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable Studio Server gate
        shell: bash
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD_RESULT: ${{ needs.build-studio-server.result }}
          API_RESULT: ${{ needs.api-tests.result }}
          WEB_RESULT: ${{ needs.web-tests.result }}
          EDITOR_REGRESSION_RESULT: ${{ needs.editor-regression.result }}
          HOST_RESULT: ${{ needs.host-compatibility.result }}
          REPOSITORY_RESULT: ${{ needs.repository-contracts.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-contracts.result }}
        run: |
          if [[ "$CLASSIFICATION_RESULT" != "success" || ( "$RELEVANT" != "true" && "$RELEVANT" != "false" ) ]]; then
            echo "::error::Studio Server change classification failed or returned no valid decision."
            exit 1
          fi
          if [[ "$RELEVANT" == "false" ]]; then
            echo "No Studio Server-affecting paths changed; heavy verification was skipped."
            exit 0
          fi
          for result in "$BUILD_RESULT" "$API_RESULT" "$WEB_RESULT" "$EDITOR_REGRESSION_RESULT" "$HOST_RESULT" "$REPOSITORY_RESULT" "$DEPLOYMENT_RESULT"; do
            test "$result" = success
          done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: always()
        with:
          sparse-checkout: scripts/ci/job-timing.mjs
          sparse-checkout-cone-mode: false
      - name: Report Studio Server verification critical path
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)"
          node scripts/ci/job-timing.mjs finish-at "$started_at" "Studio Server verification critical path"
