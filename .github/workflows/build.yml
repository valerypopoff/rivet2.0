name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Audit JavaScript dependencies
        run: yarn security:audit
      - name: Verify AI graph builder context
        run: node scripts/checks/check-graph-creator-data.mjs
      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max_old_space_size=6000
      - name: Test
        run: yarn test
      - name: Docs typecheck
        run: yarn test:docs
      - name: Test style
        run: yarn test:style
      - name: Lint
        run: yarn lint
      - name: Prettier
        run: yarn prettier:check

  rust-audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write

    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/app/src-tauri
