name: Build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-yarn
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --immutable-cache
      - name: Verify fresh Yarn PnP dependency map
        run: yarn check:pnp:fresh
      - name: Audit JavaScript dependencies
        run: yarn security:audit
      - name: Verify AI graph builder assets
        run: yarn check:graph-builder-assets
      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max_old_space_size=6000
      - name: Test
        run: yarn test
      - name: Docs typecheck
        run: yarn test:docs
      - name: Test style
        run: yarn test:style
      - name: Lint
        run: yarn lint
      - name: Prettier
        run: yarn prettier:check

  rust-audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.21.1
      - name: Install Cargo audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Verify current Rust audit exception policy
        shell: bash
        run: |
          cargo audit --json --file packages/app/src-tauri/Cargo.lock > "$RUNNER_TEMP/rust-audit-unfiltered.json" || true
          node scripts/checks/check-rust-audit-exceptions.mjs --audit-report "$RUNNER_TEMP/rust-audit-unfiltered.json"
      - name: Audit Rust dependencies
        working-directory: packages/app/src-tauri
        run: cargo audit --no-fetch
